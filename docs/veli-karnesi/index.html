<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veli Karnesi · Öğretmenler Toplantısı Değerlendirmesi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f2ee; --panel:#fff; --ink:#1d1f24; --ink2:#555b66; --ink3:#8a909b; --line:#e4e1da; --line2:#efece6;
  --accent:#b3261e; --accent-soft:#fbeceb;
  --g5:#1f7a4d; --g4:#58a36f; --g3:#d6b43a; --g2:#e08a3c; --g1:#c94a3c;
  --t5:#dcefe3; --t4:#ebf5e4; --t3:#fbf3d6; --t2:#fbe6d4; --t1:#f7dad6;
  --up:#1f7a4d; --down:#c0392b;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
button,select{font:inherit;cursor:pointer}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:16px;padding:0 16px;height:58px}
.clsel{display:flex;align-items:center;gap:10px}
.clsel select{background:#fff;color:var(--ink);border:0;border-radius:7px;padding:7px 30px 7px 12px;font-weight:700;font-size:15px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#555 50%),linear-gradient(135deg,#555 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.clsel .brand{display:flex;flex-direction:column;line-height:1.15}
.clsel .brand b{font-size:13.5px}
.clsel .brand span{font-size:11.5px;color:#b9bdc6}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{color:#cfd3da;text-decoration:none;padding:7px 13px;border-radius:6px;font-weight:500;white-space:nowrap}
nav.tabs a.on{background:#fff;color:var(--ink)}
nav.tabs a:hover:not(.on){background:#2d3038}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 58px)}
aside{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:58px;height:calc(100vh - 58px);display:flex;flex-direction:column}
aside .tools{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside input,aside select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fbfaf8}
aside ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
aside li{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:7px;cursor:pointer}
aside li:hover{background:#f6f4f0}
aside li.on{background:var(--ink);color:#fff}
aside li.on .sub{color:#b9bdc6}
aside li .av{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
aside li .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
aside li .sub{font-size:11.5px;color:var(--ink3)}
aside li .meta{min-width:0;flex:1}
aside li .noted{width:7px;height:7px;border-radius:50%;background:#3b82f6;flex:none}
main{padding:22px 26px 60px;min-width:0}
.lv-Üst{background:var(--g5)} .lv-İyi{background:var(--g4)} .lv-Orta{background:var(--g3)} .lv-Gelişmeli{background:var(--g2)} .lv-Destek{background:var(--g1)} .lv-Veri{background:#9a9a9a}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;white-space:nowrap}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 small{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink3)}
.hero{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .big{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;flex:none}
.hero h1{margin:0;font-size:25px;letter-spacing:-.2px}
.hero .ids{color:var(--ink2);font-size:13px;margin-top:2px}
.hero .nav{margin-left:auto;display:flex;gap:6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;font-weight:500}
.btn:hover{background:#f6f4f0}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:5px;background:#f0eee9;color:var(--ink2);font-weight:500}
.chip.miss{background:var(--accent-soft);color:var(--accent)}
.chip.tier{background:#e8eefc;color:#2f4a8a}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:18px;font-weight:600;margin-top:2px;line-height:1.3}
.kpi .s{font-size:12px;color:var(--ink3);margin-top:2px}
.d-up{color:var(--up);font-weight:600} .d-down{color:var(--down);font-weight:600} .d-0{color:var(--ink3)}
.agenda{border-left:4px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),#fff 60%)}
.agenda ol{margin:0;padding-left:20px} .agenda li{margin:3px 0;font-weight:500}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1200px){.cols3{grid-template-columns:1fr}.cols2{grid-template-columns:1fr}}
@media (max-width:820px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;max-height:260px}header.top{height:auto;flex-wrap:wrap;padding:8px 12px}nav.tabs{margin-left:0}aside{top:0}}
ul.ev{margin:0;padding:0;list-style:none}
ul.ev li{padding:7px 0 7px 22px;border-bottom:1px dashed var(--line2);position:relative;font-size:13px}
ul.ev li:last-child{border:0}
ul.ev li::before{position:absolute;left:0;top:7px;font-weight:700}
ul.ev.g li::before{content:'▲';color:var(--g5);font-size:11px}
ul.ev.b li::before{content:'▼';color:var(--g1);font-size:11px}
ul.ev.w li::before{content:'!';color:var(--g2);left:5px}
.empty{color:var(--ink3);font-style:italic;font-size:13px}
table{border-collapse:collapse;width:100%}
table.t th,table.t td{padding:6px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
table.t th{font-size:11.5px;color:var(--ink2);font-weight:600;background:#faf9f6}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t tr.grp td{background:#f4f2ee;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);text-align:left}
table.t td.sep,table.t th.sep{border-left:2px solid var(--line)}
.scroll{overflow:auto}
.cell{display:inline-block;min-width:48px;padding:2px 6px;border-radius:4px;font-weight:600}
.c5{background:var(--t5);color:#14532d}.c4{background:var(--t4);color:#2f5d3a}.c3{background:var(--t3);color:#6b5410}.c2{background:var(--t2);color:#7c3d12}.c1{background:var(--t1);color:#7f1d1d}
.muted{color:var(--ink3)}
.bars .row{display:grid;grid-template-columns:96px 1fr 150px;gap:10px;align-items:center;margin:10px 0}
.bars .lab{font-weight:600;font-size:13px}
.bars .track{position:relative;background:#f2f0eb;border-radius:5px;padding:2px 0}
.bars .b{height:9px;border-radius:3px;margin:2px 0}
.bars .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.bars .val{font-size:12px;color:var(--ink2)}
.e0{background:#c3c8d1}.e1{background:#7b8495}.e2{background:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tlist .t{border:1px solid var(--line2);border-radius:8px;padding:9px 12px;margin-bottom:8px}
.tlist .t b{font-size:13px}
.tlist .t div{font-size:12.5px;color:var(--ink2);margin-top:3px}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:#fffef9;resize:vertical}
.note-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
.ov th.sortable{cursor:pointer}
.ov th.sortable:hover{color:var(--ink)}
.ov td:nth-child(2),.ov th:nth-child(2){text-align:left}
.ov tr.click{cursor:pointer}
.ov tr.click:hover td{background:#faf8f3}
.dist{display:flex;height:34px;border-radius:7px;overflow:hidden;margin:6px 0 10px}
.dist div{display:grid;place-items:center;color:#fff;font-weight:600;font-size:12.5px}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:#f0eee9;color:var(--ink2);margin:1px 2px 1px 0}
.pill.r{background:var(--accent-soft);color:var(--accent)}
.hint{font-size:12px;color:var(--ink3)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}
.subjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sg{border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.sg h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.sg .ln{display:grid;grid-template-columns:1fr 62px;gap:6px;font-size:12.5px;padding:2px 0;align-items:center}
.sg .ln .bar{height:6px;border-radius:3px;background:#ebe8e2;position:relative}
.sg .ln .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.foot{margin-top:24px;font-size:12px;color:var(--ink3)}
.school .clcard{cursor:pointer}
.school .clcard:hover{border-color:#bdb8ad}
.minidist{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px}
</style>
</head>

function kpi(l,v,sub){return `<div class="kpi"><div class="l">${l}</div><div class="v num" title="${esc(String(v).replace(/<[^>]+>/g,''))}">${v}</div><div class="s">${sub||''}</div></div>`}
const chain = (vals, fn=fmt) => { const v = vals.filter(x=>x!=null); return v.length? v.map(fn).join(' → ') : '–'; };

// ---------- STUDENT ----------
function scoreRow(e, t, sc, no){
  const r = x => x? `${x[0]}/${x[1]}`:'–';
  let cr = sc.sinif;
  if(!cr && t==='NHS' && C.NHS){const o=C.NHS.score.NHS.order; cr=[o.indexOf(no)+1,o.length]}
  const avg = C[e].score[t]?.avg;
  const main = t===K.main;
  return `<tr><td>${EXN[e]}</td><td>${main?'<b>'+t+'</b>':t==='ING'?'İngilizce':t}</td><td class="num"><b>${fmt(sc.p,3)}</b></td><td class="num muted">${fmt(avg,1)}</td><td class="num">${r(cr)}</td><td class="num">${r(sc.okul)}</td><td class="num">${r(sc.genel)}</td><td class="num">${sc.dilim!=null?'%'+fmt(sc.dilim):'–'}</td></tr>`;
}
function takenV(s,e,c){
  const v = s.exams[e]?.net[c]; if(!v) return null;
  if(SUBJ[c][1]==='AYT'){ const a=v.D+v.Y; if(K.aytCodes.includes(c)) return a>0? v:null; return a>=Math.max(3,v.S*0.4)? v:null; }
  return v;
}
function subjRows(s, codes, exams, title){
  const rows = codes.filter(c => exams.some(e => takenV(s,e,c)));
  if(!rows.length) return '';
  const span = 1+exams.length*5+(exams.length>1?1:0);
  let h = `<tr class="grp"><td colspan="${span}">${title}</td></tr>`;
  for(const c of rows){
    const SQ = exams.map(e=>s.exams[e]?.net[c]?.S).find(x=>x);
    h += `<tr><td><b>${SUBJ[c][0]}</b> <span class="muted">/${SQ}</span></td>`;
    const nets=[];
    exams.forEach(e=>{
      const v = takenV(s,e,c), cs = C[e]?.subj[c];
      if(!v){ h += `<td class="sep muted" colspan="5" style="text-align:center">${s.exams[e]?'girmedi':'sınava katılmadı'}</td>`; nets.push(null); return; }
      const B = v.S - v.D - v.Y, p = pc(v.N, v.S); nets.push(v.N);
      const rank = cs && cs.order.includes(s.no)? cs.order.indexOf(s.no)+1 : null;
      h += `<td class="num sep">${v.D}</td><td class="num">${v.Y}</td><td class="num">${B}</td>
            <td class="num"><span class="cell ${cc(p)}">${fmt(v.N)}</span></td>
            <td class="num muted">${cs?fmt(cs.avg,1):'–'} <small>(${rank? rank+'/'+cs.n:'–'})</small></td>`;
    });
    if(exams.length>1){ const ok = nets.filter(x=>x!=null); h += `<td class="num sep">${ok.length>=2?delta(ok.at(-1)-ok[0]):'–'}</td>`; }
    h += '</tr>';
  }
  return h;
}
function subjHead(exams){
  let a = '<tr><th rowspan="2">Ders</th>' + exams.map(e=>`<th colspan="5" class="sep" style="text-align:center">${EXN[e]}</th>`).join('') + (exams.length>1?'<th rowspan="2" class="sep">Δ Net<br><small>ilk→son</small></th>':'') + '</tr><tr>';
  exams.forEach(()=> a += '<th class="sep">D</th><th>Y</th><th>B</th><th>Net</th><th>Sınıf ort. (sıra)</th>');
  return a+'</tr>';
}
function bars(s, blocks, getter, avgKey){
  const ys = YS(); const ecls = ys.length===3? ['e0','e1','e2'] : ys.length===2? ['e1','e2'] : ['e2'];
  const last = [...ys].reverse().find(e=>s.exams[e]) || ys.at(-1);
  if(!ys.some(e=>s.exams[e] && getter(s.exams[e]))) return '<div class="empty">Bu bölüm için sonuç yok.</div>';
  return blocks.map(([n,max])=>{
    const vals = ys.map(e=> s.exams[e] && getter(s.exams[e]) ? getter(s.exams[e])[n].N : null);
    const avg = C[last]?.score[avgKey+n]?.avg;
    const w = v => Math.max(0,v)/max*100;
    const ok = vals.filter(v=>v!=null);
    return `<div class="row"><div class="lab">${n} <span class="muted" style="font-weight:400">/${max}</span></div><div class="track">
      ${vals.map((v,i)=> `<div class="b ${ecls[i]}" style="width:${v==null?0:w(v)}%"></div>`).join('')}
      ${avg!=null?`<div class="avg" style="left:${w(avg)}%" title="Sınıf ortalaması ${fmt(avg)}"></div>`:''}</div>
      <div class="val num">${chain(vals)} ${ok.length>=2?delta(ok.at(-1)-ok[0]):''}</div></div>`;
  }).join('');
}
function legend(){ const ys=YS(); const ecls = ys.length===3? ['e0','e1','e2'] : ys.length===2? ['e1','e2'] : ['e2'];
  return `<div class="legend">${ys.map((e,i)=>`<span><i class="${ecls[i]}"></i>${e}</span>`).join('')}<span><i style="background:var(--accent);width:3px"></i>Sınıf ort. (son deneme)</span></div>`; }

    ${ys.map((e,i)=>th('a:'+e,'AYT net '+(i+1),i?'':'sep')).join('')}
    ${ys.map((e,i)=>th('m:'+e,MAIN+' '+(i+1),i?'':'sep')).join('')}
    ${hasN?th('nhs','NHS','sep'):''}${hasI?th('ing','İng.'):''}${th('risk','Madde','sep')}</tr>
  ${rows.map(s=>{const X=s.exams;return `<tr class="click" data-no="${s.no}"><td class="num">${s.no}</td><td><b>${esc(s.ad)}</b></td><td><span class="badge ${lvClass(s.seviye)}">${s.seviye}</span></td>
    <td class="num">${s.dilimOrt!=null?'%'+fmt(s.dilimOrt,1):'–'}</td>
    ${ys.map((e,i)=>`<td class="num ${i?'':'sep'}">${heat(X[e]?.tytN,120)}</td>`).join('')}<td class="num">${s.trend.tytN!=null?delta(s.trend.tytN):'–'}</td>
    ${ys.map((e,i)=>`<td class="num ${i?'':'sep'}">${heat(X[e]?.aytN,80)}</td>`).join('')}
    ${ys.map((e,i)=>`<td class="num ${i?'':'sep'}">${X[e]?.scores[MAIN]?f1(X[e].scores[MAIN].p):'–'}</td>`).join('')}
    ${hasN?`<td class="num sep">${X.NHS?.scores.NHS?f1(X.NHS.scores.NHS.p):'–'}</td>`:''}${hasI?`<td class="num">${X.ING?.scores.ING?fmt(X.ING.scores.ING.p):'–'}</td>`:''}<td class="num sep">${RISK(s)}</td></tr>`}).join('')}
  </table></div><div class="hint" style="margin-top:6px">Net renkleri: TYT 120, AYT ${K.trackName} 80 soru üzerinden başarı oranı. “–” = sınava/oturuma katılmadı.</div></div>
  <div class="card"><h3>Ders bazında sınıf ortalamaları <small>çubuk = sınıf ortalaması net / soru</small></h3>
    <div class="subjgrid">${subjCards.map(([t,e,codes])=>`<div class="sg"><h4>${t}<span class="muted" style="font-weight:400">${C[e].part.length} kişi</span></h4>
      ${codes.filter(c=>C[e].subj[c]).map(c=>{const cs=C[e].subj[c];const p=pc(cs.avg,cs.S);return `<div class="ln"><div>${SUBJ[c][0]} <span class="muted">/${cs.S} · ${cs.n} kişi</span><div class="bar"><i class="${cc(p)}" style="width:${Math.max(2,p)}%;background:currentColor"></i></div></div><div class="num" style="text-align:right">${fmt(cs.avg,1)}</div></div>`}).join('') || '<div class="empty">Veri yok</div>'}</div>`).join('')}</div>
    <div class="hint" style="margin-top:8px">Sınıfın en zayıf olduğu alanlar (oran olarak, son deneme): ${weakest().join(' · ')}</div>
  </div>
  <div class="foot">Kaynak: Veli karnesi dışa aktarımı (stoys), ${K.label}, ${S.length} öğrenci. Değerlendirme maddeleri sınıf ortalamasıyla karşılaştırma, doğru/yanlış/boş oranları ve denemeler arası değişime göre otomatik üretilmiştir; öğretmen gözlemiyle birlikte okunmalıdır.</div>`;
  document.querySelectorAll('.ov th.sortable').forEach(th=>th.onclick=()=>{const k=th.dataset.k; ovSort = {k, dir: ovSort.k===k? -ovSort.dir : (['ad','no','dil'].includes(k)?1:-1)}; renderOverview()});
  document.querySelectorAll('.ov tr.click').forEach(tr=>tr.onclick=()=>location.hash=K.slug+'-ogrenci-'+tr.dataset.no);
  renderList();
}
function weakest(){
  const arr=[]; const LAST=YS().at(-1);
  for(const [c,cs] of Object.entries(C[LAST].subj)) if(cs.S>=5 && cs.n>=4 && (SUBJ[c][1]==='TYT' || K.aytCodes.includes(c))) arr.push([`${SUBJ[c][0]} ${SUBJ[c][1]} %${Math.round(pc(cs.avg,cs.S))}`, pc(cs.avg,cs.S)]);
  if(C.NHS) for(const [c,cs] of Object.entries(C.NHS.subj)) arr.push([`${SUBJ[c][0]} (NHS) %${Math.round(pc(cs.avg,cs.S))}`, pc(cs.avg,cs.S)]);
  return arr.sort((a,b)=>a[1]-b[1]).slice(0,5).map(x=>x[0]);
}

// ---------- TEACHERS ----------
function teacherList(){ return Object.keys(K.tmap).sort((a,b)=>a.localeCompare(b,'tr')); }
function renderTeachers(ti){
  const TEACHERS = teacherList();
  const t = TEACHERS[ti] ?? TEACHERS[0];
  const order2 = {'TYT':0,'AYT':1,'NHS':2,'ING':3};
  const codes = K.tmap[t].filter(c=>{
    const g=SUBJ[c][1];
    if(g==='NHS') return K.exams.includes('NHS') && K.nhsCodes.includes(c);
    if(g==='ING') return K.exams.includes('ING');
    if(g==='AYT') return K.aytCodes.includes(c) || YS().some(e=>C[e].subj[c] && C[e].subj[c].n>=3);
    return true;
  }).sort((a,b)=>order2[SUBJ[a][1]]-order2[SUBJ[b][1]]);
  const exFor = c => SUBJ[c][1]==='NHS'?['NHS']:SUBJ[c][1]==='ING'?['ING']:YS();
  const tables = codes.map(c=>{
    const exs = exFor(c);
    const rows = S.map(s=>({s, vals: exs.map(e=>takenV(s,e,c))})).filter(r=>r.vals.some(Boolean))
      .sort((a,b)=>{const la=[...a.vals].reverse().find(Boolean), lb=[...b.vals].reverse().find(Boolean); return lb.N-la.N});
    if(!rows.length) return '';
    const S0 = rows[0].vals.find(Boolean).S;
    const lastV = r => [...r.vals].reverse().find(Boolean);
    const blankN = rows.filter(r=>{const v=lastV(r); return (v.S-v.D-v.Y)/v.S>=0.8}).length;
    return `<div class="card"><h3>${SUBJ[c][0]} · ${SUBJ[c][1]==='ING'?'AGİS':SUBJ[c][1]} <small>${S0} soru · ${exs.map(e=>EXN[e].replace('YKS Deneme ','YKS-')+' ort. '+(C[e].subj[c]?fmt(C[e].subj[c].avg,1):'–')).join(' · ')}</small>${blankN?`<span class="pill r">${blankN}/${rows.length} öğrenci son sınavda testin %80+’ını boş bıraktı</span>`:''}</h3><div class="scroll"><table class="t">
      <tr><th>Öğrenci</th>${exs.map(e=>`<th class="sep">${EXN[e].replace('YKS Deneme ','YKS-')} D/Y/B</th><th>Net</th>`).join('')}${exs.length>1?'<th class="sep">Δ</th>':''}<th class="sep">Not</th></tr>
      ${rows.map(({s,vals})=>{const fl = (s.ev.ogretmen[t]||[]).filter(x=>x.startsWith(SUBJ[c][0]+' '+(SUBJ[c][1]==='ING'?'AGİS':SUBJ[c][1])));
        const ok=vals.filter(Boolean);
        return `<tr><td><a href="#${K.slug}-ogrenci-${s.no}"><b>${esc(s.ad)}</b></a></td>${vals.map(v=> v? `<td class="num sep">${v.D}/${v.Y}/${v.S-v.D-v.Y}</td><td class="num"><span class="cell ${cc(pc(v.N,v.S))}">${fmt(v.N)}</span></td>`:'<td class="sep muted" colspan="2" style="text-align:center">–</td>').join('')}
        ${exs.length>1?`<td class="num sep">${ok.length>=2?delta(ok.at(-1).N-ok[0].N):'–'}</td>`:''}<td class="sep" style="text-align:left;white-space:normal">${[...new Set(fl)].map(x=>`<span class="pill r">${esc(x.split(': ').slice(1).join(': '))}</span>`).join('')}</td></tr>`}).join('')}
    </table></div></div>`;
  }).join('');
  const notes = S.filter(s=>s.ev.ogretmen[t]);
  $('#main').innerHTML = `<div class="card"><div class="hero"><div><h1 style="font-size:21px">Öğretmen görünümü · ${K.label}</h1><div class="ids">Öğretmen seçin: kendi derslerinde sınıfın tüm netleri, en iyiden zayıfa. Kırmızı etiketler o öğrenci için öne çıkan riskler.</div></div>
    <div class="nav"><select id="tsel" class="btn">${TEACHERS.map((x,i)=>`<option value="${i}" ${x===t?'selected':''}>${esc(x)} — ${[...new Set(K.tmap[x].map(c=>SUBJ[c][0]))].join(', ')}</option>`).join('')}</select></div></div></div>
    <div class="card"><h3>${esc(t)} için öğrenci bazlı notlar <small>${notes.length} öğrenci</small></h3>${notes.length?`<div class="tlist">${notes.map(s=>`<div class="t"><a href="#${K.slug}-ogrenci-${s.no}"><b>${esc(s.ad)}</b></a>${[...new Set(s.ev.ogretmen[t])].map(x=>`<div>• ${esc(x)}</div>`).join('')}</div>`).join('')}</div>`:'<div class="empty">Öne çıkan risk yok.</div>'}</div>
    ${tables || '<div class="card empty">Bu öğretmenin derslerine ait deneme verisi yok.</div>'}`;
  $('#tsel').onchange = e=> location.hash = K.slug+'-ogretmen-'+e.target.value;
  renderList();
}

// ---------- SCHOOL ----------
function renderSchool(){
  const all = M.classes.flatMap(c=>c.students);
  $('#main').innerHTML = `<div class="card"><div class="hero"><div><h1 style="font-size:22px">Tüm sınıflar</h1><div class="ids">${M.classes.length} sınıf · ${all.length} öğrenci · bir sınıfa tıklayınca o sınıfın özeti açılır</div></div></div></div>
  <div class="card"><h3>Okul geneli başarı dağılımı</h3>${distBar(all)}<div class="legend">${LV.map((l,i)=>{const n=all.filter(s=>s.seviye===l).length;return n?`<span><i style="background:${LVC[i]}"></i>${l} (${n})</span>`:''}).join('')}</div></div>
  <div class="card"><h3>Sınıf karşılaştırma <small>son deneme ortalamaları</small></h3><div class="scroll"><table class="t ov">
    <tr><th>Sınıf</th><th style="text-align:left">Alan</th><th>Öğrenci</th><th>Son deneme</th><th>Katılım</th><th>TYT net ort.</th><th>AYT net ort.</th><th>Ana puan ort.</th><th>TYT puan ort.</th><th>Ort. dilim</th><th style="text-align:left">Dağılım</th></tr>
    ${M.classes.map(c=>{const L=c.yks.at(-1), cs=c.cls[L], d=c.students.map(s=>s.dilimOrt).filter(x=>x!=null);
      return `<tr class="click" data-slug="${c.slug}"><td><b>${c.label}</b></td><td style="text-align:left">${c.track==='TM'?'Eşit ağırlık (EA)':'Sayısal (SAY)'}</td><td class="num">${c.students.length}</td><td>${L}</td><td class="num">${cs.part.length}/${c.students.length}</td>
      <td class="num">${heat2(cs.score.tytN?.avg,120)}</td><td class="num">${heat2(cs.score.aytN?.avg,80)}</td><td class="num">${c.main} ${f1(cs.score[c.main]?.avg)}</td><td class="num">${f1(cs.score.TYT?.avg)}</td>
      <td class="num">${d.length?'%'+fmt(d.reduce((a,b)=>a+b,0)/d.length,1):'–'}</td><td style="min-width:180px">${distBar(c.students,12)}</td></tr>`}).join('')}
  </table></div><div class="hint" style="margin-top:6px">11. sınıflarda son deneme YKS-2, 12. sınıflarda YKS-3. Ort. dilim: kurum geneli yüzdelik dilimlerin ortalaması (küçük = daha iyi).</div></div>
  <div class="card"><h3>Okulda en çok öne çıkan öğrenciler</h3><div class="cols2">
    <div><b style="font-size:13px">En iyi 10 (ortalama dilim)</b><ul class="ev g">${all.filter(s=>s.dilimOrt!=null).sort((a,b)=>a.dilimOrt-b.dilimOrt).slice(0,10).map(s=>`<li><a href="#${slugOf(s)}-ogrenci-${s.no}"><b>${esc(s.ad)}</b></a> <span class="muted">${s.sinif} · %${fmt(s.dilimOrt,1)}</span></li>`).join('')}</ul></div>
    <div><b style="font-size:13px">En çok gelişim/dikkat maddesi olan 10</b><ul class="ev w">${[...all].sort((a,b)=>RISK(b)-RISK(a)).slice(0,10).map(s=>`<li><a href="#${slugOf(s)}-ogrenci-${s.no}"><b>${esc(s.ad)}</b></a> <span class="muted">${s.sinif} · ${RISK(s)} madde</span></li>`).join('')}</ul></div>
  </div></div>`;
  document.querySelectorAll('tr[data-slug]').forEach(tr=>tr.onclick=()=>location.hash=tr.dataset.slug);
}
const heat2 = (v,max)=> v==null?'–':`<span class="cell ${cc(pc(v,max))}">${fmt(v,1)}</span>`;
const SLUGOF = new Map(); M.classes.forEach(c=>c.students.forEach(s=>SLUGOF.set(s,c.slug)));
const slugOf = s => SLUGOF.get(s);

// ---------- ROUTER ----------
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let m, slug = M.classes[0].slug, sub = '';
  if(h==='okul'){ view='okul'; }
  else {
    m = h.match(/^([0-9a-z]+)(?:-(.*))?$/);
    if(m && CL[m[1]]){ slug=m[1]; sub=m[2]||''; }
    setClass(slug);
    let x;
    if((x=sub.match(/^ogrenci-(\d+)$/)) && byNo[x[1]]){ view='ogrenci'; }
    else if((x=sub.match(/^ogretmen-(\d+)$/)) || sub==='ogretmen'){ view='ogretmen'; }
    else view='sinif';
    if(view==='ogrenci') current = x[1];
  }
  if(!S) setClass(slug);
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  $('#tabClass').href = '#'+K.slug; $('#tabStudent').href = '#'+K.slug+'-ogrenci-'+current; $('#tabTeacher').href = '#'+K.slug+'-ogretmen';
  renderList();
  if(view==='okul') renderSchool();
  else if(view==='ogrenci') renderStudent(current);
  else if(view==='ogretmen'){ const x=sub.match(/^ogretmen-(\d+)$/); renderTeachers(x?+x[1]:0); }
  else renderOverview();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.addEventListener('keydown',e=>{
  if(view!=='ogrenci' || /textarea|input|select/i.test(document.activeElement.tagName)) return;
  const i = order.indexOf(current); if(i<0) return;
  if(e.key==='ArrowRight') location.hash=K.slug+'-ogrenci-'+order[(i+1)%order.length];
  if(e.key==='ArrowLeft') location.hash=K.slug+'-ogrenci-'+order[(i-1+order.length)%order.length];
});
route();
</script>
</body>
