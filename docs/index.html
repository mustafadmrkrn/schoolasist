<title>School Asist Nöbet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Yerleşim: solda girdi paneli, sağda canlı çizelge. Dar ekranda alt alta. */
  :root {
    --bg: #EEF2F1;
    --surface: #FFFFFF;
    --surface-2: #F4F7F6;
    --ink: #12272B;
    --muted: #58706F;
    --line: #D3DEDC;
    --accent: #0E6A73;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCEEF0;
    --warn: #A64B0B;
    --warn-soft: #FBEADB;
    --font-display: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1A1C;
      --surface: #152427;
      --surface-2: #1B2D31;
      --ink: #E3EEEC;
      --muted: #8FA9A7;
      --line: #27403F;
      --accent: #5CC1C9;
      --accent-ink: #06191B;
      --accent-soft: #17383B;
      --warn: #F0A26A;
      --warn-soft: #3A2616;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1A1C;
    --surface: #152427;
    --surface-2: #1B2D31;
    --ink: #E3EEEC;
    --muted: #8FA9A7;
    --line: #27403F;
    --accent: #5CC1C9;
    --accent-ink: #06191B;
    --accent-soft: #17383B;
    --warn: #F0A26A;
    --warn-soft: #3A2616;
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 1.25rem 2.5rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 78rem; margin-inline: auto; display: grid; gap: 1.25rem; }

  /* Üst başlık */
  .top { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: flex-end; justify-content: space-between; }
  h1 { font-weight: 700; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); line-height: 1.15; letter-spacing: -0.01em; }
  .alt { margin: 0.4rem 0 0; color: var(--muted); max-width: 40rem; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .badge {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 0.25rem 0.55rem; border-radius: 4px;
  }
  .btn {
    font-weight: 600; font-size: 0.9rem; padding: 0.5rem 0.85rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Ana yerleşim */
  .layout { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 62rem) { .layout { grid-template-columns: minmax(0, 27rem) minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem; display: grid; gap: 1.25rem; min-width: 0; }
  .blok { display: grid; gap: 0.6rem; min-width: 0; }
  .blok-baslik { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .say { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Girdiler */
  .inp {
    width: 100%; min-width: 0; padding: 0.45rem 0.6rem; border: 1px solid var(--line); border-radius: 5px;
    background: var(--surface-2);
  }
  .inp::placeholder { color: var(--muted); opacity: 0.8; }
  .inp-sayi { width: 3.6rem; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .mini { font-size: 0.8rem; color: var(--muted); }
  .ikon-btn {
    width: 2rem; height: 2rem; border-radius: 5px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 1.25rem; line-height: 1; cursor: pointer;
  }
  .ikon-btn:hover { color: var(--warn); border-color: var(--line); }

  .chip {
    min-width: 2.4rem; padding: 0.3rem 0.5rem; border-radius: 5px; border: 1px solid var(--line);
    background: var(--surface-2); font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip-mini { min-width: 2rem; padding: 0.15rem 0.3rem; font-size: 0.75rem; }
  .gunler { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .yer-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 0.5rem; align-items: center; }

  .og-liste { display: grid; gap: 0.5rem; }
  .og-satir {
    display: grid; gap: 0.45rem 0.5rem; padding: 0.6rem; border: 1px solid var(--line); border-radius: 6px;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "ad sil" "gun max";
    align-items: center;
  }
  .og-ad { grid-area: ad; }
  .og-sil { grid-area: sil; }
  .og-gun { grid-area: gun; display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .og-max { grid-area: max; display: flex; align-items: center; gap: 0.4rem; justify-self: end; }
  details.toplu { border: 1px dashed var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; }
  details.toplu summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  details.toplu[open] { display: grid; gap: 0.5rem; }
  textarea.inp { min-height: 6rem; resize: vertical; }

  /* Sonuç */
  .ozet { display: flex; flex-wrap: wrap; gap: 0.5rem 0; border: 1px solid var(--line); border-radius: 6px; }
  .ozet > div { flex: 1 1 8rem; padding: 0.6rem 0.9rem; display: grid; gap: 0.1rem; border-right: 1px solid var(--line); }
  .ozet > div:last-child { border-right: 0; }
  .ozet dt { font-size: 0.75rem; color: var(--muted); }
  .ozet dd { margin: 0; font-family: var(--font-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .ozet .uyari-deger { color: var(--warn); }

  .uyari { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); border-radius: 4px; padding: 0.7rem 0.9rem; display: grid; gap: 0.3rem; }
  .uyari strong { color: var(--warn); font-size: 0.9rem; }
  .uyari ul { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; }
  .uyari p { margin: 0; font-size: 0.85rem; color: var(--muted); }

  .tablo-kap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 36rem; }
  th, td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; text-align: left; }
  th:last-child, td:last-child { border-right: 0; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  thead th { background: var(--surface-2); font-family: var(--font-display); font-size: 0.85rem; }
  tbody th { font-family: var(--font-display); font-size: 0.9rem; white-space: nowrap; background: var(--surface-2); }
  tbody th small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; color: var(--muted); }
  .kisa { display: none; }
  @media (max-width: 40rem) { .uzun { display: none; } .kisa { display: inline; } }
  .adlar { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .ad {
    font-size: 0.85rem; padding: 0.1rem 0.45rem; border-radius: 4px; background: var(--accent-soft);
    color: var(--ink); white-space: nowrap;
  }
  .ad.acik { background: transparent; border: 1px dashed var(--warn); color: var(--warn); font-weight: 600; }

  .yuk { display: grid; gap: 0.35rem; }
  .yuk-satir { display: grid; grid-template-columns: minmax(6rem, 11rem) minmax(0, 1fr) 1.6rem; gap: 0.6rem; align-items: center; font-size: 0.9rem; }
  .yuk-ad { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yuk-ad small { color: var(--muted); }
  .iz { height: 0.6rem; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .dolgu { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
  .yuk-n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

  .bos { margin: 0; padding: 1.5rem 1rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
  .alt-aksiyon { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .durum { font-size: 0.85rem; color: var(--accent); }
  #kopya-alan { font-family: var(--font-mono); font-size: 0.8rem; min-height: 9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main class="app">
  <header class="top">
    <div>
      <h1>Nöbet Çizelgesi</h1>
      <p class="alt">Öğretmenlerin okulda olduğu günlere göre, aynı gün çakışmadan ve eşit dağılımlı haftalık nöbet planı.</p>
    </div>
    <div class="top-actions">
      <span class="badge" id="ornek-etiket">Örnek veri</span>
      <button type="button" class="btn" id="btn-ornek">Örneği yükle</button>
      <button type="button" class="btn" id="btn-temizle">Temizle</button>
    </div>
  </header>

  <div class="layout">
    <section class="panel" aria-label="Girdiler">
      <div class="blok">
        <div class="blok-baslik"><h2>Nöbet günleri</h2></div>
        <div class="gunler" id="gunler"></div>
      </div>

      <div class="blok">
        <div class="blok-baslik"><h2>Nöbet yerleri</h2><span class="say">yer · kişi/gün</span></div>
        <div id="yerler" class="og-liste"></div>
        <div><button type="button" class="btn" id="yer-ekle">Yer ekle</button></div>
      </div>

      <div class="blok">
        <div class="blok-baslik"><h2>Öğretmenler</h2><span class="say" id="og-sayi">0</span></div>
        <div id="ogretmenler" class="og-liste"></div>
        <div class="alt-aksiyon"><button type="button" class="btn" id="og-ekle">Öğretmen ekle</button></div>
        <details class="toplu">
          <summary>Listeyi toplu yapıştır</summary>
          <label class="mini" for="toplu">Her satıra bir ad soyad. Hepsi tüm günler müsait eklenir.</label>
          <textarea class="inp" id="toplu" placeholder="Ayşe Demir&#10;Mehmet Kaya"></textarea>
          <div><button type="button" class="btn" id="toplu-ekle">Listeye ekle</button></div>
        </details>
      </div>
    </section>

    <section class="panel" aria-label="Çizelge">
      <div class="blok">
        <div class="blok-baslik"><h2>Haftalık çizelge</h2><span class="durum" id="durum" role="status"></span></div>
        <div id="sonuc" class="blok" aria-live="polite"></div>
        <div class="alt-aksiyon">
          <button type="button" class="btn btn-primary" id="kopyala">Çizelgeyi kopyala</button>
        </div>
        <textarea class="inp" id="kopya-alan" readonly hidden aria-label="Çizelge metni"></textarea>
      </div>
    </section>
  </div>
</main>

<script>/**
 * Nöbet çizelgesi algoritması.
 *
 * Girdi:
 *   {
 *     gunler: [0, 1, 2, 3, 4],              // 0 = Pazartesi ... 4 = Cuma
 *     yerler: [{ ad: 'Bahçe', kisi: 2 }],   // her gün her yerde kaç kişi nöbet tutacak
 *     ogretmenler: [
 *       { ad: 'Ayşe Yılmaz', gunler: [0, 1, 2], haftalikMax: 2 }
 *       // gunler: öğretmenin okulda olduğu günler
 *       // haftalikMax: isteğe bağlı, haftada en fazla nöbet sayısı
 *     ]
 *   }
 *
 * Çıktı:
 *   {
 *     atamalar: [{ gun: 0, yer: 'Bahçe', ogretmen: 'Ayşe Yılmaz' }],
 *     sayaclar: { 'Ayşe Yılmaz': 1 },
 *     uyarilar: ['Salı - Bahçe: 1 kişilik açık kaldı']
 *   }
 *
 * Yöntem: günleri ve yerleri sırayla gezer, her kontenjana o gün müsait olan,
 * o gün başka yerde görevi olmayan ve şu ana kadar en az nöbet tutmuş öğretmeni
 * atar. Eşitlikte az günü müsait olan öğretmen öne alınır (fırsatı az olanı
 * önce yerleştirmek açık kalma ihtimalini düşürür).
 */
var NOBET_GUN_ADLARI = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];

function olusturNobetCizelgesi(girdi) {
  var gunler = girdi.gunler || [0, 1, 2, 3, 4];
  var yerler = girdi.yerler || [];
  var ogretmenler = girdi.ogretmenler || [];

  var sayaclar = {};
  ogretmenler.forEach(function (o) {
    sayaclar[o.ad] = 0;
  });

  var atamalar = [];
  var uyarilar = [];

  gunler.forEach(function (gun) {
    var bugunAtananlar = {};

    yerler.forEach(function (yer) {
      var eksik = 0;

      for (var k = 0; k < yer.kisi; k++) {
        var adaylar = ogretmenler.filter(function (o) {
          var limit = o.haftalikMax > 0 ? o.haftalikMax : Infinity;
          return (
            o.gunler.indexOf(gun) > -1 &&
            !bugunAtananlar[o.ad] &&
            sayaclar[o.ad] < limit
          );
        });

        if (adaylar.length === 0) {
          eksik++;
          continue;
        }

        adaylar.sort(function (a, b) {
          return (
            sayaclar[a.ad] - sayaclar[b.ad] ||
            a.gunler.length - b.gunler.length ||
            a.ad.localeCompare(b.ad, 'tr')
          );
        });

        var secilen = adaylar[0];
        bugunAtananlar[secilen.ad] = true;
        sayaclar[secilen.ad]++;
        atamalar.push({ gun: gun, yer: yer.ad, ogretmen: secilen.ad });
      }

      if (eksik > 0) {
        uyarilar.push(
          NOBET_GUN_ADLARI[gun] + ' - ' + yer.ad + ': ' + eksik + ' kişilik açık kaldı'
        );
      }
    });
  });

  return { atamalar: atamalar, sayaclar: sayaclar, uyarilar: uyarilar };
}
</script>
<script>
  var GUN = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma'];
  var KISA = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum'];
  var TUM = [0, 1, 2, 3, 4];

  function ornek() {
    return {
      gunler: [0, 1, 2, 3, 4],
      yerler: [
        { ad: 'Bahçe', kisi: 2 },
        { ad: 'Zemin kat', kisi: 1 },
        { ad: '1. kat', kisi: 1 },
        { ad: 'Kantin', kisi: 1 }
      ],
      ogretmenler: [
        { ad: 'Ayşe Demir', gunler: [0, 1, 2, 3, 4], max: 0 },
        { ad: 'Mehmet Kaya', gunler: [0, 1, 2, 3, 4], max: 0 },
        { ad: 'Elif Şahin', gunler: [0, 1, 2], max: 0 },
        { ad: 'Burak Yıldız', gunler: [1, 2, 3, 4], max: 0 },
        { ad: 'Zeynep Çelik', gunler: [0, 1, 2, 3, 4], max: 0 },
        { ad: 'Hasan Arslan', gunler: [0, 2, 4], max: 0 },
        { ad: 'Fatma Koç', gunler: [0, 1, 2, 3, 4], max: 0 },
        { ad: 'Ali Öztürk', gunler: [0, 1, 2, 3], max: 0 },
        { ad: 'Selin Aydın', gunler: [2, 3, 4], max: 0 },
        { ad: 'Murat Polat', gunler: [0, 1, 2, 3, 4], max: 0 },
        { ad: 'Derya Güneş', gunler: [0, 1, 3, 4], max: 0 },
        { ad: 'Emre Kılıç', gunler: [1, 2, 3], max: 1 }
      ]
    };
  }

  var state = ornek();
  var son = null;
  var zaman = null;
  var istek = 0;

  function $(id) { return document.getElementById(id); }

  function el(tag, props, kids) {
    var e = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'value') e.value = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v);
    });
    (kids || []).forEach(function (c) {
      if (c !== null && c !== undefined) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return e;
  }

  function planla() {
    $('ornek-etiket').hidden = true;
    clearTimeout(zaman);
    zaman = setTimeout(hesapla, 150);
  }

  /* ---------- Girdi panelleri ---------- */
  function renderGunler() {
    var kap = $('gunler');
    kap.textContent = '';
    GUN.forEach(function (ad, i) {
      var b = el('button', {
        type: 'button', class: 'chip', 'aria-label': ad,
        'aria-pressed': String(state.gunler.indexOf(i) > -1), text: KISA[i]
      });
      b.addEventListener('click', function () {
        var k = state.gunler.indexOf(i);
        if (k > -1) state.gunler.splice(k, 1); else state.gunler.push(i);
        b.setAttribute('aria-pressed', String(k === -1));
        planla();
      });
      kap.appendChild(b);
    });
  }

  function renderYerler() {
    var kap = $('yerler');
    kap.textContent = '';
    state.yerler.forEach(function (y, i) {
      var ad = el('input', {
        type: 'text', id: 'yer-ad-' + i, class: 'inp', value: y.ad, placeholder: 'Nöbet yeri',
        'aria-label': 'Nöbet yeri adı', oninput: function () { y.ad = this.value; planla(); }
      });
      var kisi = el('input', {
        type: 'number', id: 'yer-kisi-' + i, class: 'inp inp-sayi', min: '1', max: '20', value: String(y.kisi),
        'aria-label': 'Günlük kişi sayısı', oninput: function () { y.kisi = parseInt(this.value, 10) || 0; planla(); }
      });
      var sil = el('button', {
        type: 'button', class: 'ikon-btn', 'aria-label': (y.ad || 'Bu yeri') + ' sil', text: '×',
        onclick: function () { state.yerler.splice(i, 1); renderYerler(); planla(); }
      });
      kap.appendChild(el('div', { class: 'yer-satir' }, [ad, el('label', { class: 'mini', for: 'yer-kisi-' + i, text: 'kişi' }), kisi, sil]));
    });
  }

  function renderOgretmenler() {
    var kap = $('ogretmenler');
    kap.textContent = '';
    $('og-sayi').textContent = state.ogretmenler.length + ' kişi';
    state.ogretmenler.forEach(function (o, i) {
      var ad = el('input', {
        type: 'text', id: 'og-ad-' + i, class: 'inp og-ad', value: o.ad, placeholder: 'Ad soyad',
        'aria-label': 'Öğretmen adı', oninput: function () { o.ad = this.value; planla(); }
      });
      var sil = el('button', {
        type: 'button', class: 'ikon-btn og-sil', 'aria-label': (o.ad || 'Bu öğretmeni') + ' sil', text: '×',
        onclick: function () { state.ogretmenler.splice(i, 1); renderOgretmenler(); planla(); }
      });
      var gunler = el('div', { class: 'og-gun', role: 'group', 'aria-label': 'Okulda olduğu günler' });
      GUN.forEach(function (g, d) {
        var b = el('button', {
          type: 'button', class: 'chip chip-mini', 'aria-label': g,
          'aria-pressed': String(o.gunler.indexOf(d) > -1), text: KISA[d]
        });
        b.addEventListener('click', function () {
          var k = o.gunler.indexOf(d);
          if (k > -1) o.gunler.splice(k, 1); else o.gunler.push(d);
          b.setAttribute('aria-pressed', String(k === -1));
          planla();
        });
        gunler.appendChild(b);
      });
      var max = el('input', {
        type: 'number', id: 'og-max-' + i, class: 'inp inp-sayi', min: '0', max: '5', placeholder: '–',
        value: o.max > 0 ? String(o.max) : '', 'aria-label': 'Haftada en fazla nöbet sayısı',
        oninput: function () { o.max = parseInt(this.value, 10) || 0; planla(); }
      });
      kap.appendChild(el('div', { class: 'og-satir' }, [
        ad, sil, gunler,
        el('div', { class: 'og-max' }, [el('label', { class: 'mini', for: 'og-max-' + i, text: 'en fazla' }), max])
      ]));
    });
  }

  function renderGirdi() { renderGunler(); renderYerler(); renderOgretmenler(); }

  /* ---------- Hesaplama ---------- */
  function girdiOlustur() {
    return {
      gunler: state.gunler.slice().sort(),
      yerler: state.yerler
        .filter(function (y) { return y.ad.trim() && y.kisi > 0; })
        .map(function (y) { return { ad: y.ad.trim(), kisi: y.kisi }; }),
      ogretmenler: state.ogretmenler
        .filter(function (o) { return o.ad.trim(); })
        .map(function (o) { return { ad: o.ad.trim(), gunler: o.gunler.slice(), haftalikMax: o.max > 0 ? o.max : 0 }; })
    };
  }

  function hesapla() {
    var girdi = girdiOlustur();
    var no = ++istek;
    var p;
    if (typeof olusturNobetCizelgesi === 'function') {
      p = Promise.resolve(olusturNobetCizelgesi(girdi));
    } else {
      p = new Promise(function (ok, hata) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(hata).cizelgeUret(girdi);
      });
    }
    p.then(function (s) { if (no === istek) renderSonuc(girdi, s); })
      .catch(function (e) {
        var kap = $('sonuc');
        kap.textContent = '';
        kap.appendChild(el('p', { class: 'bos', text: 'Çizelge oluşturulamadı: ' + (e && e.message ? e.message : e) }));
      });
  }

  /* ---------- Sonuç ---------- */
  function renderSonuc(girdi, s) {
    var kap = $('sonuc');
    kap.textContent = '';
    son = null;
    $('kopyala').disabled = true;
    $('kopya-alan').hidden = true;

    if (!girdi.gunler.length || !girdi.yerler.length || !girdi.ogretmenler.length) {
      kap.appendChild(el('p', { class: 'bos', text: 'En az bir gün, bir nöbet yeri ve bir öğretmen ekleyince çizelge burada oluşur.' }));
      return;
    }

    var harita = {};
    s.atamalar.forEach(function (a) {
      var k = a.gun + '|' + a.yer;
      (harita[k] = harita[k] || []).push(a.ogretmen);
    });

    var gunlukKisi = girdi.yerler.reduce(function (t, y) { return t + y.kisi; }, 0);
    var kontenjan = gunlukKisi * girdi.gunler.length;
    var acik = kontenjan - s.atamalar.length;
    var sayilar = girdi.ogretmenler.map(function (o) {
      return { ad: o.ad, n: s.sayaclar[o.ad] || 0, max: o.haftalikMax };
    });
    var enAz = Math.min.apply(null, sayilar.map(function (c) { return c.n; }));
    var enCok = Math.max.apply(null, sayilar.map(function (c) { return c.n; }));

    /* Özet */
    function stat(etiket, deger, uyari) {
      return el('div', {}, [el('dt', { text: etiket }), el('dd', { class: uyari ? 'uyari-deger' : '', text: deger })]);
    }
    kap.appendChild(el('dl', { class: 'ozet' }, [
      stat('Öğretmen', String(girdi.ogretmenler.length)),
      stat('Yerleşen nöbet', s.atamalar.length + ' / ' + kontenjan),
      stat('Açık kalan', String(acik), acik > 0),
      stat('Kişi başı nöbet', enAz === enCok ? String(enCok) : enAz + '–' + enCok)
    ]));

    /* Uyarılar */
    var adSayac = {};
    girdi.ogretmenler.forEach(function (o) { adSayac[o.ad] = (adSayac[o.ad] || 0) + 1; });
    var tekrar = Object.keys(adSayac).filter(function (a) { return adSayac[a] > 1; });
    if (s.uyarilar.length || tekrar.length) {
      var liste = el('ul');
      s.uyarilar.forEach(function (u) { liste.appendChild(el('li', { text: u })); });
      tekrar.forEach(function (a) { liste.appendChild(el('li', { text: '“' + a + '” iki kez girilmiş, sayılar birleşiyor.' })); });
      var kutu = el('div', { class: 'uyari', role: 'status' }, [el('strong', { text: s.uyarilar.length ? 'Dolmayan nöbetler' : 'Dikkat' }), liste]);
      if (s.uyarilar.length) {
        kutu.appendChild(el('p', { text: 'O gün müsait öğretmen kalmadı. Öğretmenlerin günlerini açın, “en fazla” sınırını yükseltin ya da kişi sayısını azaltın.' }));
      }
      kap.appendChild(kutu);
    }

    /* Tablo */
    var basliklar = [el('th', { scope: 'col', text: 'Yer' })];
    girdi.gunler.forEach(function (g) {
      basliklar.push(el('th', { scope: 'col' }, [el('span', { class: 'uzun', text: GUN[g] }), el('span', { class: 'kisa', text: KISA[g] })]));
    });
    var govde = el('tbody');
    girdi.yerler.forEach(function (y) {
      var satir = el('tr', {}, [el('th', { scope: 'row' }, [y.ad, el('small', { text: y.kisi + ' kişi/gün' })])]);
      girdi.gunler.forEach(function (g) {
        var adlar = harita[g + '|' + y.ad] || [];
        var hucre = el('div', { class: 'adlar' });
        adlar.forEach(function (a) { hucre.appendChild(el('span', { class: 'ad', text: a })); });
        var eksik = y.kisi - adlar.length;
        if (eksik > 0) hucre.appendChild(el('span', { class: 'ad acik', text: 'Açık' + (eksik > 1 ? ' ×' + eksik : '') }));
        satir.appendChild(el('td', {}, [hucre]));
      });
      govde.appendChild(satir);
    });
    kap.appendChild(el('div', { class: 'tablo-kap' }, [
      el('table', {}, [el('thead', {}, [el('tr', {}, basliklar)]), govde])
    ]));

    /* Nöbet yükü */
    var olcek = Math.max(enCok, 1);
    var yuk = el('div', { class: 'yuk' });
    sayilar.forEach(function (c) {
      var ad = el('span', { class: 'yuk-ad', title: c.ad }, [c.ad, c.max > 0 ? el('small', { text: ' (en çok ' + c.max + ')' }) : null]);
      var dolgu = el('div', { class: 'dolgu' });
      dolgu.style.width = (c.n / olcek * 100) + '%';
      yuk.appendChild(el('div', { class: 'yuk-satir' }, [ad, el('div', { class: 'iz' }, [dolgu]), el('span', { class: 'yuk-n', text: String(c.n) })]));
    });
    kap.appendChild(el('h2', { text: 'Kişi başı nöbet sayısı' }));
    kap.appendChild(yuk);

    son = metinUret(girdi, harita);
    $('kopyala').disabled = false;
  }

  function metinUret(girdi, harita) {
    var satirlar = [];
    girdi.gunler.forEach(function (g) {
      satirlar.push(GUN[g]);
      girdi.yerler.forEach(function (y) {
        var adlar = (harita[g + '|' + y.ad] || []).slice();
        var eksik = y.kisi - adlar.length;
        if (eksik > 0) adlar.push('(açık' + (eksik > 1 ? ' ×' + eksik : '') + ')');
        satirlar.push('  ' + y.ad + ': ' + adlar.join(', '));
      });
      satirlar.push('');
    });
    return satirlar.join('\n').trim();
  }

  function bildir(m) {
    $('durum').textContent = m;
    setTimeout(function () { $('durum').textContent = ''; }, 2500);
  }

  /* ---------- Olaylar ---------- */
  $('kopyala').addEventListener('click', function () {
    if (!son) return;
    var alan = $('kopya-alan');
    function yedek() {
      alan.value = son;
      alan.hidden = false;
      alan.focus();
      alan.select();
      bildir('Metni seçip kopyalayın');
    }
    try {
      navigator.clipboard.writeText(son).then(function () { bildir('Kopyalandı'); }, yedek);
    } catch (e) { yedek(); }
  });

  $('yer-ekle').addEventListener('click', function () {
    state.yerler.push({ ad: '', kisi: 1 });
    renderYerler();
    $('yer-ad-' + (state.yerler.length - 1)).focus();
    planla();
  });

  $('og-ekle').addEventListener('click', function () {
    state.ogretmenler.push({ ad: '', gunler: TUM.slice(), max: 0 });
    renderOgretmenler();
    $('og-ad-' + (state.ogretmenler.length - 1)).focus();
    planla();
  });

  $('toplu-ekle').addEventListener('click', function () {
    $('toplu').value.split(/\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (ad) {
      state.ogretmenler.push({ ad: ad, gunler: TUM.slice(), max: 0 });
    });
    $('toplu').value = '';
    renderOgretmenler();
    planla();
  });

  $('btn-ornek').addEventListener('click', function () {
    state = ornek();
    renderGirdi();
    hesapla();
    $('ornek-etiket').hidden = false;
  });

  $('btn-temizle').addEventListener('click', function () {
    state = { gunler: TUM.slice(), yerler: [], ogretmenler: [] };
    renderGirdi();
    hesapla();
    $('ornek-etiket').hidden = true;
  });

  renderGirdi();
  hesapla();
</script>
