<div class="top">
  <div>
    <p class="panel-ad">Veli karnesi değerlendirme</p>
    <p class="alt">Deneme platformundan aldığınız “VELİ KARNE” sayfalarını yükleyin; her sınıf için öğrenci öğrenci değerlendirme, sınıf özeti ve öğretmen notları hazırlanır.</p>
  </div>
  <div class="top-actions">
    <label class="kr-sec-etiket" for="kr-sinif" id="kr-sinif-kap" hidden>
      <span class="mini">Sınıf</span>
      <select class="inp kr-sinif" id="kr-sinif"></select>
    </label>
    <label class="btn btn-primary kr-yukle-btn">
      <input type="file" id="kr-dosya" accept=".html,.htm,text/html" multiple hidden>
      Karne yükle
    </label>
  </div>
</div>

<div class="segment kr-mod" role="tablist" aria-label="Görünüm" id="kr-mod" hidden>
  <button type="button" class="seg" role="tab" data-g="sinif" aria-selected="true">Sınıf özeti</button>
  <button type="button" class="seg" role="tab" data-g="ogrenci" aria-selected="false">Öğrenci detayı</button>
  <button type="button" class="seg" role="tab" data-g="ogretmen" aria-selected="false">Öğretmen görünümü</button>
  <button type="button" class="seg" role="tab" data-g="okul" aria-selected="false">Tüm sınıflar</button>
</div>

<p class="kr-durum" id="kr-durum" role="status" hidden></p>
<div id="kr-govde"></div>

<style>
  #kr-govde { display: grid; gap: 1rem; min-width: 0; }
  .kr-sec-etiket { display: grid; gap: 0.15rem; }
  .kr-sinif { min-width: 9rem; font-family: var(--font-display); font-weight: 700; background: var(--surface); }
  .kr-yukle-btn { cursor: pointer; align-self: end; }
  .kr-mod { grid-template-columns: repeat(4, auto); justify-content: start; width: max-content; max-width: 100%; overflow-x: auto; }
  .kr-mod .seg { padding-inline: 0.95rem; white-space: nowrap; }
  .kr-durum { margin: 0; font-size: 0.9rem; padding: 0.55rem 0.8rem; border-radius: 6px; background: var(--accent-soft); color: var(--ink); }
  .kr-durum.hata { background: var(--warn-soft); color: var(--warn); }
  .kr-birak { border: 2px dashed var(--line); border-radius: 10px; padding: 2.2rem 1.2rem; text-align: center; background: var(--surface); display: grid; gap: 0.6rem; justify-items: center; }
  .kr-birak.uzerinde { border-color: var(--accent); background: var(--accent-soft); }
  .kr-birak h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; }
  .kr-birak p { margin: 0; color: var(--muted); max-width: 38rem; }
  .kr-birak ol { margin: 0; text-align: left; color: var(--muted); font-size: 0.9rem; max-width: 38rem; }

  .kr-kart { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1rem 1.1rem; display: grid; gap: 0.7rem; min-width: 0; align-content: start; }
  .kr-kart > h2 { display: flex; flex-wrap: wrap; gap: 0.3rem 0.6rem; align-items: baseline; }
  .kr-kart > h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.8rem; color: var(--muted); }
  .kr-iki { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
  .kr-uc { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 62rem) { .kr-iki { grid-template-columns: 1fr 1fr; } .kr-uc { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .kr-gostergeler { display: grid; gap: 0.6rem; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); }
  .kr-gosterge { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0.7rem 0.85rem; display: grid; gap: 0.15rem; }
  .kr-gosterge .e { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .kr-gosterge .d { font-family: var(--font-mono); font-size: 1.08rem; font-variant-numeric: tabular-nums; line-height: 1.3; }
  .kr-gosterge .a { font-size: 0.8rem; color: var(--muted); }
  .kr-art { color: #17663F; font-weight: 600; } .kr-azal { color: #B42318; font-weight: 600; } .kr-sabit { color: var(--muted); }

  .kr-sv { display: inline-flex; align-items: center; padding: 0.1rem 0.55rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; color: #fff; white-space: nowrap; }
  .kr-sv-0 { background: #17663F; } .kr-sv-1 { background: #3E8E5A; } .kr-sv-2 { background: #1D5FD8; } .kr-sv-3 { background: #C2650F; } .kr-sv-4 { background: #B42318; } .kr-sv-5 { background: #8A99B3; }
  .kr-dag { display: flex; height: 2rem; border-radius: 6px; overflow: hidden; }
  .kr-dag > div { display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 0.82rem; }
  .kr-dag.ince { height: 0.6rem; border-radius: 4px; }
  .kr-lejant { display: flex; flex-wrap: wrap; gap: 0.3rem 0.9rem; font-size: 0.8rem; color: var(--muted); }
  .kr-lejant i { display: inline-block; width: 0.75rem; height: 0.55rem; border-radius: 2px; margin-right: 0.3rem; vertical-align: middle; }

  .kr-tablo th, .kr-tablo td { white-space: nowrap; padding: 0.4rem 0.55rem; }
  .kr-tablo td.s, .kr-tablo th.s { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.88rem; }
  .kr-tablo thead th { font-size: 0.78rem; }
  .kr-tablo tr.grup td { background: var(--surface-2); font-family: var(--font-display); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .kr-tablo tr.tik { cursor: pointer; }
  .kr-tablo tr.tik:hover td, .kr-tablo tr.tik:hover th { background: var(--accent-soft); }
  .kr-tablo th.sirala { cursor: pointer; user-select: none; }
  .kr-tablo th.sirala:hover { color: var(--accent); }
  .kr-tablo .silik { color: var(--muted); }
  .kr-h { display: inline-block; min-width: 3rem; padding: 0.05rem 0.4rem; border-radius: 4px; font-weight: 600; text-align: right; }
  .kr-h5 { background: #DDF3E6; color: #14532D; } .kr-h4 { background: #EAF6EC; color: #2F5D3A; } .kr-h3 { background: #FBF3D6; color: #6B5410; }
  .kr-h2 { background: #FDEEDC; color: #7C3D12; } .kr-h1 { background: #FBE1DE; color: #7F1D1D; }

  .kr-ogr-yer { display: grid; gap: 1rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 62rem) { .kr-ogr-yer { grid-template-columns: 15rem minmax(0, 1fr); } }
  .kr-liste { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 3rem); position: sticky; top: 1rem; }
  @media (max-width: 62rem) { .kr-liste { position: static; max-height: 18rem; } }
  .kr-liste-ust { padding: 0.6rem; border-bottom: 1px solid var(--line); display: grid; gap: 0.4rem; }
  .kr-liste ul { list-style: none; margin: 0; padding: 0.35rem; overflow: auto; }
  .kr-liste li button { display: grid; grid-template-columns: 2rem minmax(0, 1fr) auto; gap: 0.55rem; align-items: center; width: 100%; text-align: left; padding: 0.45rem 0.5rem; border: 0; border-radius: 6px; background: transparent; cursor: pointer; }
  .kr-liste li button:hover { background: var(--surface-2); }
  .kr-liste li button[aria-current="true"] { background: var(--yan); color: #fff; }
  .kr-liste li button[aria-current="true"] .kr-alt { color: var(--yan-muted); }
  .kr-av { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 0.72rem; font-weight: 700; }
  .kr-ad { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kr-alt { font-size: 0.75rem; color: var(--muted); }
  .kr-notlu { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--accent); }

  .kr-bas { display: flex; flex-wrap: wrap; gap: 0.8rem 1.1rem; align-items: center; }
  .kr-bas .kr-av { width: 3.4rem; height: 3.4rem; font-size: 1.1rem; }
  .kr-bas h3 { margin: 0; font-family: var(--font-display); font-size: 1.45rem; line-height: 1.15; }
  .kr-bas .kr-yon { margin-left: auto; display: flex; gap: 0.4rem; }
  .kr-cipler { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
  .kr-cip { font-size: 0.75rem; padding: 0.05rem 0.45rem; border-radius: 4px; background: var(--surface-2); color: var(--muted); font-weight: 600; }
  .kr-cip.yok { background: var(--warn-soft); color: var(--warn); }
  .kr-cip.vurgu { background: var(--accent-soft); color: var(--accent); }
  .kr-gundem { border-left: 3px solid var(--accent); background: var(--accent-soft); }
  .kr-gundem ol { margin: 0; padding-left: 1.2rem; font-weight: 600; }
  .kr-madde { list-style: none; margin: 0; padding: 0; font-size: 0.9rem; }
  .kr-madde li { position: relative; padding: 0.4rem 0 0.4rem 1.3rem; border-bottom: 1px dashed var(--line); }
  .kr-madde li:last-child { border-bottom: 0; }
  .kr-madde li::before { position: absolute; left: 0; top: 0.42rem; font-weight: 700; font-size: 0.8rem; }
  .kr-madde.g li::before { content: '▲'; color: #17663F; }
  .kr-madde.z li::before { content: '▼'; color: #B42318; }
  .kr-madde.d li::before { content: '!'; color: var(--warn); left: 0.3rem; font-size: 0.95rem; top: 0.35rem; }
  .kr-bos { color: var(--muted); font-style: italic; font-size: 0.9rem; margin: 0; }

  .kr-cubuk { display: grid; grid-template-columns: 6rem minmax(0, 1fr) 9.5rem; gap: 0.6rem; align-items: center; margin: 0.25rem 0; }
  .kr-cubuk .ad { background: none; font-weight: 600; font-size: 0.88rem; padding: 0; }
  .kr-cubuk .iz2 { position: relative; background: var(--surface-2); border-radius: 4px; padding: 2px 0; }
  .kr-cubuk .c { height: 0.5rem; border-radius: 3px; margin: 2px 0; }
  .kr-c0 { background: #B7C9EE; } .kr-c1 { background: #6F92D9; } .kr-c2 { background: var(--yan); }
  .kr-cubuk .ort { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn); }
  .kr-cubuk .deg { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); text-align: right; }

  .kr-ogretmen-not { border: 1px solid var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; font-size: 0.85rem; }
  .kr-ogretmen-not strong { font-family: var(--font-display); }
  .kr-ogretmen-not div { color: var(--muted); }
  .kr-etiket { display: inline-block; font-size: 0.72rem; padding: 0.05rem 0.45rem; border-radius: 999px; background: var(--warn-soft); color: var(--warn); margin: 0.1rem 0.15rem 0.1rem 0; white-space: nowrap; }
  .kr-not textarea { min-height: 7rem; resize: vertical; background: var(--surface); }
  .kr-dersler { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); }
  .kr-ders { border: 1px solid var(--line); border-radius: 6px; padding: 0.6rem 0.75rem; display: grid; gap: 0.25rem; align-content: start; }
  .kr-ders h4 { margin: 0 0 0.2rem; font-family: var(--font-display); font-size: 0.92rem; display: flex; justify-content: space-between; }
  .kr-ders .sat { display: grid; grid-template-columns: minmax(0, 1fr) 3rem; gap: 0.5rem; font-size: 0.85rem; align-items: center; }
  .kr-ders .cb { height: 0.4rem; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .kr-ders .cb i { display: block; height: 100%; background: var(--accent); }
  .kr-siniflar { display: grid; gap: 0.5rem; }
  .kr-sinif-satir { display: flex; flex-wrap: wrap; gap: 0.4rem 0.8rem; align-items: center; justify-content: space-between; padding: 0.5rem 0.7rem; border: 1px solid var(--line); border-radius: 6px; }
</style>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KR = { siniflar: [], k: null, gorunum: 'sinif', no: null, ara: '', sirala: 'no', ovS: { k: 'dil', y: 1 }, ogretmen: 0, yuklendi: false };
  var SV = KARNE_SEVIYE, SVR = ['≤%10', '%10–25', '%25–45', '%45–65', '>%65', 'sınav yok'];
  var SVC = ['#17663F', '#3E8E5A', '#1D5FD8', '#C2650F', '#B42318', '#8A99B3'];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (x, d) { if (x == null) return '–'; return (Math.round(x * 100) / 100).toLocaleString('tr-TR', { maximumFractionDigits: d === undefined ? 2 : d }); };
  var f1 = function (x) { return x == null ? '–' : x.toLocaleString('tr-TR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); };
  var oran = function (n, s) { return s ? 100 * n / s : 0; };
  var hr = function (p) { return p >= 85 ? 'kr-h5' : p >= 70 ? 'kr-h4' : p >= 50 ? 'kr-h3' : p >= 30 ? 'kr-h2' : 'kr-h1'; };
  var hucre = function (v, max) { return v == null ? '<span class="silik">–</span>' : '<span class="kr-h ' + hr(oran(v, max)) + '">' + fmt(v) + '</span>'; };
  var fark = function (d) { return d == null ? '' : '<span class="' + (d > 0.001 ? 'kr-art' : d < -0.001 ? 'kr-azal' : 'kr-sabit') + '">' + (d > 0 ? '+' : '') + fmt(d) + '</span>'; };
  var zincir = function (a, f) { var v = a.filter(function (x) { return x != null; }); return v.length ? v.map(f || fmt).join(' → ') : '–'; };
  var svNo = function (s) { var i = SV.indexOf(s); return i < 0 ? 5 : i; };
  var rozet = function (s) { return '<span class="kr-sv kr-sv-' + svNo(s) + '">' + esc(s) + '</span>'; };
  var harf = function (n) { return n.split(' ').filter(Boolean).map(function (w) { return w[0]; }).slice(0, 2).join('').toLocaleUpperCase('tr'); };
  var risk = function (s) { return s.ev.dikkat.length + s.ev.gelisim.length; };
  var D = KARNE_DERS;

  function anahtar() { return 'mdea_karne_' + (MDEA.kullanici || 'misafir'); }
  function notAnahtar(no) { return 'mdea_karne_not_' + (MDEA.kullanici || 'misafir') + '_' + KR.k.kimlik + '_' + no; }
  function depoOku(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function depoYaz(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function kaydet() {
    var ok = depoYaz(anahtar(), JSON.stringify(KR.siniflar));
    if (!ok) durum('Sınıflar bu oturumda açık; tarayıcı depolaması dolu olduğu için kalıcı kaydedilemedi.', true);
  }
  function yukle() {
    if (KR.yuklendi === (MDEA.kullanici || 'misafir')) return;
    KR.yuklendi = MDEA.kullanici || 'misafir';
    try { KR.siniflar = JSON.parse(depoOku(anahtar()) || '[]') || []; } catch (e) { KR.siniflar = []; }
    KR.k = KR.siniflar[0] || null; KR.no = null;
    ciz();
  }
  function durum(m, hata) { var e = $('kr-durum'); e.hidden = !m; e.textContent = m || ''; e.classList.toggle('hata', !!hata); }

  /* ---------- Dosya yükleme ---------- */
  function dosyalariIsle(dosyalar) {
    var l = Array.prototype.slice.call(dosyalar || []);
    if (!l.length) return;
    durum(l.length + ' dosya okunuyor…');
    Promise.all(l.map(function (f) {
      return new Promise(function (ok) {
        var r = new FileReader();
        r.onload = function () { ok({ ad: f.name, metin: String(r.result || '') }); };
        r.onerror = function () { ok({ ad: f.name, metin: '' }); };
        r.readAsText(f, 'utf-8');
      });
    })).then(function (sonuc) {
      var eklenen = [], hatali = [], ilk = null;
      sonuc.forEach(function (x) {
        var ham = karneOku(x.metin);
        if (!ham.ogrenciler.length) { hatali.push(x.ad); return; }
        var gruplar = {};
        ham.ogrenciler.forEach(function (o) { (gruplar[o.sinif || 'Sınıf'] = gruplar[o.sinif || 'Sınıf'] || []).push(o); });
        Object.keys(gruplar).forEach(function (g) {
          var m = karneSinifKur({ ogrenciler: gruplar[g], ogretmenler: ham.ogretmenler }, x.ad);
          var i = KR.siniflar.map(function (c) { return c.kimlik; }).indexOf(m.kimlik);
          if (i > -1) KR.siniflar[i] = m; else KR.siniflar.push(m);
          eklenen.push(m.etiket + ' (' + m.ogrenciler.length + ')');
          if (!ilk) ilk = m;
        });
      });
      KR.siniflar.sort(function (a, b) { return a.etiket.localeCompare(b.etiket, 'tr', { numeric: true }); });
      if (ilk) KR.k = KR.siniflar.filter(function (c) { return c.kimlik === ilk.kimlik; })[0];
      kaydet();
      KR.no = null; KR.gorunum = 'sinif';
      durum((eklenen.length ? 'Eklendi: ' + eklenen.join(', ') + '.' : '') + (hatali.length ? ' Okunamadı (veli karnesi değil): ' + hatali.join(', ') + '.' : ''), !eklenen.length);
      ciz();
    });
  }
  $('kr-dosya').addEventListener('change', function (e) { dosyalariIsle(e.target.files); e.target.value = ''; });
  $('kr-sinif').addEventListener('change', function (e) { KR.k = KR.siniflar[+e.target.value]; KR.no = null; KR.ogretmen = 0; if (KR.gorunum === 'okul') KR.gorunum = 'sinif'; ciz(); });
  Array.prototype.forEach.call($('kr-mod').querySelectorAll('.seg'), function (b) {
    b.addEventListener('click', function () { KR.gorunum = b.getAttribute('data-g'); ciz(); });
  });

  /* ---------- Ortak ---------- */
  function gosterge(e, d, a) { return '<div class="kr-gosterge"><span class="e">' + e + '</span><span class="d">' + d + '</span><span class="a">' + (a || '') + '</span></div>'; }
  function dagilim(ogr, ince) {
    var say = SV.map(function (l) { return ogr.filter(function (s) { return s.seviye === l; }).length; });
    return '<div class="kr-dag' + (ince ? ' ince' : '') + '">' + say.map(function (c, i) { return c ? '<div style="flex:' + c + ';background:' + SVC[i] + '">' + (ince ? '' : c) + '</div>' : ''; }).join('') + '</div>';
  }
  function lejant(ogr) {
    return '<div class="kr-lejant">' + SV.map(function (l, i) { var n = ogr.filter(function (s) { return s.seviye === l; }).length; return n ? '<span><i style="background:' + SVC[i] + '"></i>' + l + ' (' + n + ') — ' + SVR[i] + '</span>' : ''; }).join('') + '</div>';
  }
  function girdi(s, e, c) {
    var v = s.sinavlar[e] && s.sinavlar[e].net[c]; if (!v) return null;
    if (D[c][1] === 'AYT') { var a = v.D + v.Y; if (KR.k.aytKodlar.indexOf(c) > -1) return a > 0 ? v : null; return a >= Math.max(3, v.S * 0.4) ? v : null; }
    return v;
  }
  function sonY(s) { var y = KR.k.yks.filter(function (e) { return s.sinavlar[e]; }); return y.length ? s.sinavlar[y[y.length - 1]] : null; }
  function kisaAd(e) { return KR.k.sinavAd[e].replace('YKS Deneme ', 'YKS-'); }

  /* ---------- Ana çizim ---------- */
  function ciz() {
    var var_ = KR.siniflar.length > 0;
    $('kr-mod').hidden = !var_;
    $('kr-sinif-kap').hidden = !var_;
    var sel = $('kr-sinif');
    sel.innerHTML = KR.siniflar.map(function (c, i) { return '<option value="' + i + '">' + esc(c.etiket) + '</option>'; }).join('');
    if (var_) { if (KR.siniflar.indexOf(KR.k) < 0) KR.k = KR.siniflar[0]; sel.value = String(KR.siniflar.indexOf(KR.k)); }
    Array.prototype.forEach.call($('kr-mod').querySelectorAll('.seg'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-g') === KR.gorunum ? 'true' : 'false'); });
    var g = $('kr-govde');
    if (!var_) { g.innerHTML = bosEkran(); birakmaKur(); return; }
    if (KR.gorunum === 'ogrenci') ogrenciCiz(g);
    else if (KR.gorunum === 'ogretmen') ogretmenCiz(g);
    else if (KR.gorunum === 'okul') okulCiz(g);
    else sinifCiz(g);
  }
  function bosEkran() {
    return '<div class="kr-birak" id="kr-birak"><h3>Veli karnelerini buraya bırakın</h3>' +
      '<p>Her sınıf için deneme platformunun “Veli Karnesi” sayfasını tarayıcıda açıp <strong>Farklı kaydet → Web sayfası (.html)</strong> ile kaydedin; dosyaları birlikte yükleyebilirsiniz. Sınıf adı karneden okunur.</p>' +
      '<ol><li>YKS denemeleri (TYT/AYT), Neler Hatırlıyorum ve İngilizce AGİS sonuçları okunur.</li><li>MF/FEN sınıfları SAY, TM sınıfları EA puanına göre değerlendirilir.</li><li>Veriler yalnızca bu tarayıcıda, hesabınıza özel saklanır; sunucuya gönderilmez.</li></ol>' +
      '<label class="btn btn-primary" style="cursor:pointer"><input type="file" accept=".html,.htm,text/html" multiple hidden id="kr-dosya2">Dosya seç</label></div>';
  }
  function birakmaKur() {
    var b = $('kr-birak'); if (!b) return;
    $('kr-dosya2').addEventListener('change', function (e) { dosyalariIsle(e.target.files); });
    ['dragenter', 'dragover'].forEach(function (t) { b.addEventListener(t, function (e) { e.preventDefault(); b.classList.add('uzerinde'); }); });

    var gelisim = benimY.length ? '<section class="kr-kart"><h2>Deneme deneme gelişim</h2><div class="tablo-kap"><table class="kr-tablo"><thead><tr><th>Deneme</th><th class="s">TYT net</th>' +
      KARNE_TYT_BLOK.map(function (b) { return '<th class="s">' + b[0] + '</th>'; }).join('') + '<th class="s">AYT ' + K.alanAd + '</th>' + K.aytBloklar.map(function (b) { return '<th class="s">' + b[0] + '</th>'; }).join('') +
      '<th class="s">TYT puan</th><th class="s">' + ANA + ' puan</th><th class="s">' + ANA + ' sınıf sıra</th><th class="s">' + ANA + ' genel dilim</th></tr></thead><tbody>' +
      ys.map(function (e) {
        var x = X[e];
        if (!x) return '<tr><th>' + esc(K.sinavAd[e]) + '</th><td colspan="' + (11 + K.aytBloklar.length) + '" class="silik" style="text-align:center">sınava katılmadı</td></tr>';
        var m = x.puan[ANA];
        return '<tr><th>' + esc(K.sinavAd[e]) + '</th><td class="s">' + hucre(x.tytN, 120) + '</td>' + KARNE_TYT_BLOK.map(function (b) { return '<td class="s">' + fmt(x.tyt[b[0]].N) + '</td>'; }).join('') +
          '<td class="s">' + (x.aytN != null ? hucre(x.aytN, 80) : '<span class="silik">girmedi</span>') + '</td>' + K.aytBloklar.map(function (b) { return '<td class="s">' + (x.ayt ? fmt(x.ayt[b[0]].N) : '–') + '</td>'; }).join('') +
          '<td class="s">' + f1(x.puan.TYT && x.puan.TYT.p) + '</td><td class="s"><strong>' + (m ? f1(m.p) : '–') + '</strong></td><td class="s">' + (m && m.sinif ? m.sinif.join('/') : '–') + '</td><td class="s">' + (m ? '%' + fmt(m.dilim, 1) : '–') + '</td></tr>';
      }).join('') + '</tbody></table></div></section>' : '';

    var puanSat = K.sinavlar.filter(function (e) { return X[e]; }).map(function (e) {
      return Object.keys(X[e].puan).map(function (t) {
        var p = X[e].puan[t], cr = p.sinif;
        if (!cr && t === 'NHS' && K.ist.NHS && K.ist.NHS.puan.NHS) { var o = K.ist.NHS.puan.NHS.sira; cr = [o.indexOf(s.no) + 1, o.length]; }
        var ort = K.ist[e].puan[t] && K.ist[e].puan[t].ort, r = function (x) { return x ? x[0] + '/' + x[1] : '–'; };
        return '<tr><th>' + esc(K.sinavAd[e]) + '</th><td>' + (t === ANA ? '<strong>' + t + '</strong>' : t === 'ING' ? 'İngilizce' : t) + '</td><td class="s"><strong>' + fmt(p.p, 3) + '</strong></td><td class="s silik">' + fmt(ort, 1) + '</td><td class="s">' + r(cr) + '</td><td class="s">' + r(p.okul) + '</td><td class="s">' + r(p.genel) + '</td><td class="s">' + (p.dilim != null ? '%' + fmt(p.dilim) : '–') + '</td></tr>';
      }).join('');
    }).join('');
    var digerAyt = KARNE_SAY.concat(KARNE_SOZ).filter(function (c, j, a) { return K.aytKodlar.indexOf(c) < 0 && a.indexOf(c) === j; });
    var madde = function (a, c) { return a.length ? '<ul class="kr-madde ' + c + '">' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '<p class="kr-bos">Belirgin bir madde yok.</p>'; };
    var ogt = Object.keys(s.ev.ogretmen);
    var not = depoOku(notAnahtar(s.no)) || '';

    $('kr-detay').innerHTML =
      '<section class="kr-kart"><div class="kr-bas"><span class="kr-av" style="background:' + SVC[svNo(s.seviye)] + '">' + esc(harf(s.ad)) + '</span>' +
        '<div><h3>' + esc(s.ad) + '</h3><div class="mini">No ' + esc(s.no) + ' · ' + esc(K.etiket) + ' · ' + rozet(s.seviye) + (s.dilimOrt != null ? ' kurum geneli ortalama dilim %' + fmt(s.dilimOrt, 1) + ' (' + ANA + '/TYT)' : '') + '</div>' +
        '<div class="kr-cipler">' + (s.sinifIci ? '<span class="kr-cip vurgu">Sınıf içi ' + s.sinifIci[0] + '/' + s.sinifIci[1] + ' · ' + s.grup + ' grup</span>' : '') +
          K.sinavlar.map(function (e) { return '<span class="kr-cip' + (X[e] ? '' : ' yok') + '">' + (X[e] ? '✓ ' : '✗ ') + esc(K.sinavAd[e]) + '</span>'; }).join('') + '</div></div>' +
        '<div class="kr-yon"><button type="button" class="btn" data-git="' + esc(onceki) + '">← Önceki</button><button type="button" class="btn btn-primary" data-git="' + esc(sonraki) + '">Sonraki →</button></div></div></section>' +
      (gs.length ? '<div class="kr-gostergeler">' + gs.join('') + '</div>' : '') +
      '<section class="kr-kart kr-gundem"><h2>Toplantıda konuşulacaklar</h2><ol>' + s.ev.gundem.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></section>' +
      '<div class="kr-uc"><section class="kr-kart"><h2>Güçlü yönler</h2>' + madde(s.ev.guclu, 'g') + '</section><section class="kr-kart"><h2>Gelişim alanları</h2>' + madde(s.ev.gelisim, 'z') + '</section><section class="kr-kart"><h2>Dikkat edilecekler</h2>' + madde(s.ev.dikkat, 'd') + '</section></div>' +
      (benimY.length ? gelisim + '<div class="kr-iki"><section class="kr-kart"><h2>TYT blokları <small>40 Türkçe · 20 Sosyal · 40 Mat · 20 Fen</small></h2>' + cubukLejant() + cubuklar(s, KARNE_TYT_BLOK, function (x) { return x.tyt; }, 'tyt_') + '</section>' +
        '<section class="kr-kart"><h2>AYT ' + K.alanAd + ' blokları <small>' + K.aytBloklar.map(function (b) { return b[2] + ' ' + b[0]; }).join(' · ') + '</small></h2>' + cubukLejant() + cubuklar(s, K.aytBloklar, function (x) { return x.ayt; }, 'ayt_') + '</section></div>' : '') +
      (puanSat ? '<section class="kr-kart"><h2>Puanlar ve sıralamalar</h2><div class="tablo-kap"><table class="kr-tablo"><thead><tr><th>Sınav</th><th>Puan türü</th><th class="s">Puan</th><th class="s">Sınıf ort.</th><th class="s">Sınıf sıra</th><th class="s">Okul sıra</th><th class="s">Genel sıra</th><th class="s">Yüzdelik dilim</th></tr></thead><tbody>' + puanSat + '</tbody></table></div>' +
        '<p class="mini" style="margin:0">Yüzdelik dilim: kurum geneli katılımcılar içindeki yer — küçük olan daha iyi.' + (K.sinavlar.indexOf('NHS') > -1 ? ' NHS sınıf sırası karnede yoktu, puanlardan hesaplandı.' : '') + '</p></section>' : '') +
      ((benimY.length || X.NHS || X.ING) ? '<section class="kr-kart"><h2>Ders ders tüm netler <small>D doğru · Y yanlış · B boş · renk = net / soru</small></h2>' +
        (benimY.length ? '<div class="tablo-kap"><table class="kr-tablo">' + dersBaslik(ys) + '<tbody>' + dersSatirlari(s, KARNE_TYT_KOD, ys, 'TYT') + dersSatirlari(s, K.aytKodlar, ys, 'AYT · ' + K.alanAd) + dersSatirlari(s, digerAyt, ys, 'AYT · alan dışı (girdiği testler)') + '</tbody></table></div>' : '') +
        (X.NHS ? '<div class="tablo-kap"><table class="kr-tablo">' + dersBaslik(['NHS']) + '<tbody>' + dersSatirlari(s, K.nhsKodlar, ['NHS'], K.sinavAd.NHS) + '</tbody></table></div>' : '') +
        (X.ING ? '<div class="tablo-kap"><table class="kr-tablo">' + dersBaslik(['ING']) + '<tbody>' + dersSatirlari(s, ['ING'], ['ING'], 'İngilizce AGİS') + '</tbody></table></div>' : '') + '</section>' : '') +
      '<div class="kr-iki"><section class="kr-kart"><h2>Öğretmenlere düşen notlar</h2>' +
        (ogt.length ? ogt.map(function (t) { return '<div class="kr-ogretmen-not"><strong>' + esc(t) + '</strong>' + s.ev.ogretmen[t].filter(function (x, j, a) { return a.indexOf(x) === j; }).map(function (x) { return '<div>• ' + esc(x) + '</div>'; }).join('') + '</div>'; }).join('') : '<p class="kr-bos">Ders öğretmenleri için öne çıkan risk yok.</p>') + '</section>' +
      '<section class="kr-kart kr-not"><h2>Toplantı notu / alınan karar</h2><textarea class="inp" id="kr-not" placeholder="Toplantıda konuşulanları, alınan kararları yazın… (bu tarayıcıda saklanır)">' + esc(not) + '</textarea>' +
        '<div class="alt-aksiyon"><button type="button" class="btn btn-primary" id="kr-kopya">Değerlendirmeyi + notu kopyala</button><button type="button" class="btn" id="kr-kopya-hepsi">Sınıfın tüm notlarını kopyala</button><span class="durum" id="kr-kopya-durum"></span></div></section></div>';

    $('kr-not').addEventListener('input', function (e) { depoYaz(notAnahtar(s.no), e.target.value); });
    $('kr-not').addEventListener('change', listeCiz);
    $('kr-kopya').addEventListener('click', function () { kopyala(ozetMetin(s)); });
    $('kr-kopya-hepsi').addEventListener('click', function () { kopyala(K.etiket + '\n\n' + K.ogrenciler.map(ozetMetin).join('\n\n────────\n\n')); });
    Array.prototype.forEach.call($('kr-detay').querySelectorAll('[data-git]'), function (b) {
      b.addEventListener('click', function () { KR.no = b.getAttribute('data-git'); listeCiz(); detayCiz(); window.scrollTo(0, 0); });
    });
  }
  function ozetMetin(s) {
    var n = depoOku(notAnahtar(s.no)) || '';
    return s.ad + ' (No ' + s.no + ') — ' + s.seviye + '\nGündem: ' + s.ev.gundem.join('; ') + '\nGüçlü: ' + (s.ev.guclu.slice(0, 3).join('; ') || '-') + '\nGelişim: ' + (s.ev.gelisim.slice(0, 3).join('; ') || '-') + (n ? '\nToplantı notu: ' + n : '');
  }
  function kopyala(t) {
    var d = $('kr-kopya-durum');
    var bitti = function (m) { if (d) { d.textContent = m; setTimeout(function () { d.textContent = ''; }, 2000); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { bitti('Kopyalandı.'); }, function () { bitti('Kopyalanamadı.'); });
    else bitti('Kopyalanamadı.');
  }
  document.addEventListener('keydown', function (e) {
    if ($('panel-karne').hidden || KR.gorunum !== 'ogrenci' || !KR.k || /textarea|input|select/i.test(document.activeElement.tagName)) return;
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var l = listeSirali().map(function (x) { return x.no; }), i = l.indexOf(KR.no); if (i < 0) return;
    KR.no = l[(i + (e.key === 'ArrowRight' ? 1 : l.length - 1)) % l.length]; listeCiz(); detayCiz();
  });

  /* ---------- Öğretmen ---------- */
  function ogretmenCiz(g) {
    var K = KR.k, S = K.ogrenciler, adlar = Object.keys(K.ogretmenDers).sort(function (a, b) { return a.localeCompare(b, 'tr'); });
    if (!adlar.length) { g.innerHTML = '<p class="bos">Bu sınıfın karnesinde ders öğretmeni listesi yok.</p>'; return; }
    var t = adlar[KR.ogretmen] || adlar[0];
    var sira = { TYT: 0, AYT: 1, NHS: 2, ING: 3 };
    var kodlar = K.ogretmenDers[t].filter(function (c) {
      var gr = D[c][1];
      if (gr === 'NHS') return K.sinavlar.indexOf('NHS') > -1 && K.nhsKodlar.indexOf(c) > -1;
      if (gr === 'ING') return K.sinavlar.indexOf('ING') > -1;
      if (gr === 'AYT') return K.aytKodlar.indexOf(c) > -1 || K.yks.some(function (e) { return K.ist[e].ders[c] && K.ist[e].ders[c].n >= 3; });
      return true;
    }).sort(function (a, b) { return sira[D[a][1]] - sira[D[b][1]]; });
    var notlu = S.filter(function (s) { return s.ev.ogretmen[t]; });
    var tablolar = kodlar.map(function (c) {
      var ex = D[c][1] === 'NHS' ? ['NHS'] : D[c][1] === 'ING' ? ['ING'] : K.yks;
      var sat = S.map(function (s) { return { s: s, v: ex.map(function (e) { return girdi(s, e, c); }) }; }).filter(function (r) { return r.v.some(Boolean); });
      if (!sat.length) return '';
      var son = function (r) { return r.v.filter(Boolean).slice(-1)[0]; };
      sat.sort(function (a, b) { return son(b).N - son(a).N; });
      var bos = sat.filter(function (r) { var v = son(r); return (v.S - v.D - v.Y) / v.S >= 0.8; }).length;
      var gr = D[c][1] === 'ING' ? 'AGİS' : D[c][1];
      return '<section class="kr-kart"><h2>' + D[c][0] + ' · ' + gr + ' <small>' + son(sat[0]).S + ' soru · ' + ex.map(function (e) { return kisaAd(e) + ' ort. ' + (K.ist[e].ders[c] ? fmt(K.ist[e].ders[c].ort, 1) : '–'); }).join(' · ') + '</small>' +
        (bos ? '<span class="kr-etiket">' + bos + '/' + sat.length + ' öğrenci son sınavda testin %80+’ını boş bıraktı</span>' : '') + '</h2>' +
        '<div class="tablo-kap"><table class="kr-tablo"><thead><tr><th>Öğrenci</th>' + ex.map(function (e) { return '<th class="s">' + kisaAd(e) + ' D/Y/B</th><th class="s">Net</th>'; }).join('') + (ex.length > 1 ? '<th class="s">Δ</th>' : '') + '<th>Not</th></tr></thead><tbody>' +
        sat.map(function (r) {
          var ok = r.v.filter(Boolean);
          var et = (r.s.ev.ogretmen[t] || []).filter(function (x, j, a) { return x.indexOf(D[c][0] + ' ' + gr) === 0 && a.indexOf(x) === j; });
          return '<tr class="tik" data-ogr="' + esc(r.s.no) + '"><th>' + esc(r.s.ad) + '</th>' + r.v.map(function (v) { return v ? '<td class="s">' + v.D + '/' + v.Y + '/' + (v.S - v.D - v.Y) + '</td><td class="s">' + hucre(v.N, v.S) + '</td>' : '<td colspan="2" class="silik" style="text-align:center">–</td>'; }).join('') +
            (ex.length > 1 ? '<td class="s">' + (ok.length >= 2 ? fark(ok[ok.length - 1].N - ok[0].N) : '–') + '</td>' : '') +
            '<td style="white-space:normal">' + et.map(function (x) { return '<span class="kr-etiket">' + esc(x.split(': ').slice(1).join(': ')) + '</span>'; }).join('') + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
    }).join('');
    g.innerHTML = '<section class="kr-kart"><div class="kr-bas"><div><h3 style="font-size:1.2rem">Öğretmen görünümü · ' + esc(K.etiket) + '</h3><p class="mini" style="margin:0.2rem 0 0">Öğretmen seçin: kendi derslerinde sınıfın tüm netleri, en iyiden zayıfa. Turuncu etiketler o öğrenci için öne çıkan riskler.</p></div>' +
      '<div class="kr-yon"><select class="inp" id="kr-ogt">' + adlar.map(function (x, i) { return '<option value="' + i + '"' + (x === t ? ' selected' : '') + '>' + esc(x) + ' — ' + K.ogretmenDers[x].map(function (c) { return D[c][0]; }).filter(function (v, j, a) { return a.indexOf(v) === j; }).join(', ') + '</option>'; }).join('') + '</select></div></div></section>' +
      '<section class="kr-kart"><h2>' + esc(t) + ' için öğrenci bazlı notlar <small>' + notlu.length + ' öğrenci</small></h2>' +
        (notlu.length ? notlu.map(function (s) { return '<div class="kr-ogretmen-not"><a href="#" data-ogr="' + esc(s.no) + '"><strong>' + esc(s.ad) + '</strong></a>' + s.ev.ogretmen[t].filter(function (x, j, a) { return a.indexOf(x) === j; }).map(function (x) { return '<div>• ' + esc(x) + '</div>'; }).join('') + '</div>'; }).join('') : '<p class="kr-bos">Öne çıkan risk yok.</p>') + '</section>' +
      (tablolar || '<p class="bos">Bu öğretmenin derslerine ait deneme verisi yok.</p>');
    $('kr-ogt').addEventListener('change', function (e) { KR.ogretmen = +e.target.value; ciz(); });
    ogrLinkleri(g);
  }

  /* ---------- Tüm sınıflar ---------- */
  function okulCiz(g) {
    var tum = []; KR.siniflar.forEach(function (c) { c.ogrenciler.forEach(function (s) { tum.push({ s: s, c: c }); }); });
    var hepsi = tum.map(function (x) { return x.s; });
    var iyi = tum.filter(function (x) { return x.s.dilimOrt != null; }).sort(function (a, b) { return a.s.dilimOrt - b.s.dilimOrt; }).slice(0, 10);
    var zor = tum.slice().sort(function (a, b) { return risk(b.s) - risk(a.s); }).slice(0, 10);
    var bag = function (x) { return '<a href="#" data-sinif="' + KR.siniflar.indexOf(x.c) + '" data-ogr2="' + esc(x.s.no) + '"><strong>' + esc(x.s.ad) + '</strong></a> <span class="silik">' + esc(x.c.etiket) + '</span>'; };
    g.innerHTML = '<div class="kr-gostergeler">' + gosterge('Sınıf', KR.siniflar.length, KR.siniflar.map(function (c) { return c.etiket; }).join(', ')) + gosterge('Öğrenci', hepsi.length, '') +
        gosterge('Hiç sınava girmeyen', hepsi.filter(function (s) { return s.seviye === 'Veri yok'; }).length, 'karnede sonuç yok') + '</div>' +
      '<section class="kr-kart"><h2>Okul geneli başarı dağılımı</h2>' + dagilim(hepsi) + lejant(hepsi) + '</section>' +
      '<section class="kr-kart"><h2>Sınıf karşılaştırma <small>son deneme ortalamaları · satıra tıklayınca sınıf açılır</small></h2><div class="tablo-kap"><table class="kr-tablo"><thead><tr><th>Sınıf</th><th>Alan</th><th class="s">Öğrenci</th><th>Son deneme</th><th class="s">Katılım</th><th class="s">TYT net ort.</th><th class="s">AYT net ort.</th><th class="s">Ana puan ort.</th><th class="s">TYT puan ort.</th><th class="s">Ort. dilim</th><th style="min-width:10rem">Dağılım</th></tr></thead><tbody>' +
        KR.siniflar.map(function (c, i) {
          var son = c.yks[c.yks.length - 1], I = son ? c.ist[son] : null, d = c.ogrenciler.map(function (s) { return s.dilimOrt; }).filter(function (x) { return x != null; });
          return '<tr class="tik" data-sinif-ac="' + i + '"><th>' + esc(c.etiket) + '</th><td>' + (c.alan === 'TM' ? 'Eşit ağırlık (EA)' : 'Sayısal (SAY)') + '</td><td class="s">' + c.ogrenciler.length + '</td><td>' + (son ? son : '–') + '</td>' +
            '<td class="s">' + (I ? I.katilan.length + '/' + c.ogrenciler.length : '–') + '</td><td class="s">' + hucre(I && I.puan.tytN ? karneYuv(I.puan.tytN.ort, 1) : null, 120) + '</td><td class="s">' + hucre(I && I.puan.aytN ? karneYuv(I.puan.aytN.ort, 1) : null, 80) + '</td>' +
            '<td class="s">' + c.ana + ' ' + f1(I && I.puan[c.ana] ? I.puan[c.ana].ort : null) + '</td><td class="s">' + f1(I && I.puan.TYT ? I.puan.TYT.ort : null) + '</td><td class="s">' + (d.length ? '%' + fmt(karneOrt(d), 1) : '–') + '</td><td>' + dagilim(c.ogrenciler, true) + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="mini" style="margin:0">Ort. dilim: kurum geneli yüzdelik dilimlerin ortalaması (küçük = daha iyi).</p></section>' +
      '<div class="kr-iki"><section class="kr-kart"><h2>En iyi 10 <small>ortalama dilim</small></h2><ul class="kr-madde g">' + iyi.map(function (x) { return '<li>' + bag(x) + ' · %' + fmt(x.s.dilimOrt, 1) + '</li>'; }).join('') + '</ul></section>' +
      '<section class="kr-kart"><h2>En çok gelişim/dikkat maddesi olan 10</h2><ul class="kr-madde d">' + zor.map(function (x) { return '<li>' + bag(x) + ' · ' + risk(x.s) + ' madde</li>'; }).join('') + '</ul></section></div>';
    Array.prototype.forEach.call(g.querySelectorAll('[data-sinif-ac]'), function (r) { r.addEventListener('click', function () { KR.k = KR.siniflar[+r.getAttribute('data-sinif-ac')]; KR.gorunum = 'sinif'; ciz(); }); });
    Array.prototype.forEach.call(g.querySelectorAll('[data-ogr2]'), function (a) {
      a.addEventListener('click', function (e) { e.preventDefault(); KR.k = KR.siniflar[+a.getAttribute('data-sinif')]; KR.no = a.getAttribute('data-ogr2'); KR.gorunum = 'ogrenci'; ciz(); window.scrollTo(0, 0); });
    });
  }

  document.addEventListener('mdea:panel', function (e) { if (e.detail.id === 'karne') yukle(); });
  document.addEventListener('mdea:giris', function () { KR.yuklendi = false; if (!$('panel-karne').hidden) yukle(); });
})();
</script>
