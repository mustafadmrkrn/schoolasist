<script>
/**
 * Mentörlük ders programı: saf yardımcılar (DOM yok, testli).
 * Veri biçimi eski "Mentörlük Ders Programı" sayfasıyla aynıdır; o sayfadan alınan
 * yedek dosyası (mentorluk-yedek-*.json) doğrudan yüklenebilir.
 *
 * db = {
 *   students: [{ id, name, cls }],
 *   plans: [{ id, sid, date: 'YYYY-MM-DD', start: 8, end: 23, grid: { 'gün-saat': { c, m, q } }, note }],
 *   courses: [{ id, name, color }],
 *   tpls: [{ id, name, start, end, grid }],
 *   cfg: { org, mentor, logo, okul: { acik, bas, bit } },
 *   sid, pid, lastBackup
 * }
 * grid anahtarı: gün 0-6 (Pazartesi=0), saat 0-23. m: 0 ders, 1 soru çözümü (q = soru adedi), 2 ders tekrarı.
 */
var MENTOR_GUNLER = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
var MENTOR_GUN_KISA = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
var MENTOR_TURLER = ['Ders', 'Soru çözümü', 'Ders tekrarı'];
var MENTOR_DERSLER = [
  ['Matematik', '#dc2626'], ['Fizik', '#2563eb'], ['Kimya', '#059669'], ['Edebiyat', '#7c3aed'],
  ['Tarih', '#ea580c'], ['İngilizce', '#0891b2'], ['Coğrafya', '#0d9488'], ['Biyoloji', '#16a34a'],
  ['Almanca', '#b45309'], ['Kitap Okuma', '#db2777']
];

function mentorId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function mentorBugun() {
  var d = new Date();
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function mentorSaat(h) { return String(h % 24).padStart(2, '0') + ':00'; }

function mentorTarih(d) {
  if (!d) return '-';
  var x = typeof d === 'number' ? new Date(d) : new Date(String(d) + (String(d).length === 10 ? 'T12:00:00' : ''));
  return isNaN(x) ? String(d) : x.toLocaleDateString('tr-TR');
}

function mentorSablon(ad, satirlar) {
  var g = {};
  satirlar.forEach(function (s) {
    var gunler = s[0], saatler = s[1], c = s[2], m = s[3], q = s[4];
    gunler.forEach(function (d) {
      saatler.forEach(function (t) { g[d + '-' + t] = q ? { c: c, m: m, q: q } : { c: c, m: m }; });
    });
  });
  return { id: mentorId(), name: ad, start: 8, end: 23, grid: g };
}

function mentorVarsayilanSablonlar() {
  return [
    mentorSablon('Sayısal 12. Sınıf', [
      [[0, 2, 4], [17], 'c0', 1, 40], [[0, 2, 4], [18], 'c1', 0], [[0, 2, 4], [20], 'c2', 2],
      [[1, 3], [17], 'c7', 0], [[1, 3], [18], 'c1', 1, 30], [[1, 3], [20], 'c0', 2],
      [[5], [10, 11], 'c0', 1, 60], [[5], [14, 15], 'c1', 1, 40], [[5], [17], 'c2', 2],
      [[6], [10, 11], 'c7', 0], [[6], [14], 'c0', 2], [[6], [16], 'c3', 0]
    ]),
    mentorSablon('Sınav Haftası', [
      [[0, 1, 2, 3, 4], [17], 'c0', 2], [[0, 1, 2, 3, 4], [18], 'c1', 1, 30], [[0, 1, 2, 3, 4], [20], 'c2', 2],
      [[5, 6], [10, 11], 'c0', 1, 60], [[5, 6], [14, 15], 'c1', 1, 40], [[5, 6], [17], 'c7', 2]
    ])
  ];
}

function mentorYeniDb(mentorAdi) {
  return {
    students: [], plans: [],
    courses: MENTOR_DERSLER.map(function (c, i) { return { id: 'c' + i, name: c[0], color: c[1] }; }),
    tpls: mentorVarsayilanSablonlar(),
    cfg: { org: '', mentor: mentorAdi || '', logo: '', okul: { acik: true, bas: 10, bit: 17 } },
    sid: null, pid: null, lastBackup: 0
  };
}

/** Yedekten ya da depodan gelen veriyi doğrular, eksikleri tamamlar. Geçersizse null. */
function mentorDbDuzelt(x, mentorAdi) {
  if (!x || typeof x !== 'object' || !Array.isArray(x.students) || !Array.isArray(x.plans) || !Array.isArray(x.courses)) return null;
  var y = mentorYeniDb(mentorAdi);
  y.students = x.students.filter(function (s) { return s && s.id && s.name; })
    .map(function (s) { return { id: String(s.id), name: String(s.name), cls: s.cls ? String(s.cls) : '' }; });
  var ogr = {};
  y.students.forEach(function (s) { ogr[s.id] = true; });
  y.courses = x.courses.filter(function (c) { return c && c.id && c.name; })
    .map(function (c) { return { id: String(c.id), name: String(c.name), color: /^#[0-9a-f]{3,8}$/i.test(c.color) ? c.color : '#64748b' }; });
  var saat = function (v, d) { v = Number(v); return v >= 0 && v <= 23 ? Math.floor(v) : d; };
  var izgara = function (g) {
    var o = {};
    Object.keys(g || {}).forEach(function (k) {
      var v = g[k];
      if (!/^[0-6]-([0-9]|1[0-9]|2[0-3])$/.test(k) || !v || !v.c) return;
      var m = v.m === 1 || v.m === 2 ? v.m : 0;
      o[k] = m === 1 && v.q > 0 ? { c: String(v.c), m: 1, q: Math.min(9999, Math.floor(v.q)) } : { c: String(v.c), m: m };
    });
    return o;
  };
  y.plans = x.plans.filter(function (p) { return p && p.id && ogr[p.sid]; }).map(function (p) {
    var bas = saat(p.start, 8), bit = saat(p.end, 23);
    var o = { id: String(p.id), sid: String(p.sid), date: /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : mentorBugun(), start: Math.min(bas, bit), end: Math.max(bas, bit), grid: izgara(p.grid) };
    if (p.note) o.note = String(p.note);
    return o;
  });
  if (Array.isArray(x.tpls)) {
    y.tpls = x.tpls.filter(function (t) { return t && t.id && t.name; }).map(function (t) {
      return { id: String(t.id), name: String(t.name), start: saat(t.start, 8), end: saat(t.end, 23), grid: izgara(t.grid) };
    });
  }
  var cfg = x.cfg || {};
  y.cfg.org = cfg.org ? String(cfg.org) : '';
  y.cfg.mentor = cfg.mentor !== undefined ? String(cfg.mentor) : (mentorAdi || '');
  y.cfg.logo = typeof cfg.logo === 'string' && cfg.logo.indexOf('data:image/') === 0 ? cfg.logo : '';
  if (cfg.okul) {
    y.cfg.okul = { acik: cfg.okul.acik !== false, bas: saat(cfg.okul.bas, 10), bit: saat(cfg.okul.bit, 17) };
  }
  y.sid = ogr[x.sid] ? x.sid : null;
  y.pid = y.plans.some(function (p) { return p.id === x.pid; }) ? x.pid : null;
  y.lastBackup = Number(x.lastBackup) || 0;
  return y;
}

/** Okul saati mi? Hafta içi, cfg.okul.bas ≤ saat < cfg.okul.bit. */
function mentorOkulMu(db, d, t) {
  var o = db && db.cfg && db.cfg.okul;
  if (!o || !o.acik) return false;
  return d < 5 && t >= o.bas && t < o.bit;
}

function mentorEtiket(v) {
  if (!v) return '';
  if (v.m === 1) return 'Soru çözümü' + (v.q ? ': ' + v.q : '');
  if (v.m === 2) return 'Ders tekrarı';
  return '';
}

function mentorDers(db, id) {
  for (var i = 0; i < db.courses.length; i++) if (db.courses[i].id === id) return db.courses[i];
  return null;
}

function mentorProgramlari(db, sid) {
  return db.plans.filter(function (p) { return p.sid === sid; }).sort(function (a, b) {
    return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  });
}

/** Saat, soru ve ders sayıları. Okul saatine düşen ve silinmiş derse ait hücreler sayılmaz. */
function mentorOzet(db, programlar) {
  var r = { saat: 0, soru: 0, tur: [0, 0, 0], ders: {} };
  programlar.forEach(function (p) {
    Object.keys(p.grid).forEach(function (k) {
      var dt = k.split('-').map(Number);
      var v = p.grid[k];
      if (mentorOkulMu(db, dt[0], dt[1]) || !mentorDers(db, v.c)) return;
      r.saat++;
      r.soru += v.q || 0;
      r.tur[v.m]++;
      r.ders[v.c] = (r.ders[v.c] || 0) + 1;
    });
  });
  return r;
}

/** Bir günü başka güne kopyalar (okul saatleri atlanır). Programı değiştirir. */
function mentorGunKopyala(db, p, a, b) {
  if (a === b) return;
  for (var t = 0; t < 24; t++) {
    if (mentorOkulMu(db, b, t)) continue;
    var v = p.grid[a + '-' + t];
    if (v && !mentorOkulMu(db, a, t)) p.grid[b + '-' + t] = JSON.parse(JSON.stringify(v));
    else delete p.grid[b + '-' + t];
  }
}

/** Toplu öğrenci listesi: her satır "Ad Soyad, Sınıf" (virgül, noktalı virgül ya da sekme). */
function mentorTopluOku(metin) {
  var sonuc = [];
  String(metin || '').split(/\r?\n/).forEach(function (l) {
    var p = l.trim().split(/\t|;|,/).map(function (x) { return x.trim(); });
    if (p[0]) sonuc.push({ name: p[0], cls: p[1] || '' });
  });
  return sonuc;
}

/** Excel'in açabileceği CSV satırları. */
function mentorCsvSatirlari(db, s, p) {
  var c = db.cfg || {};
  var satirlar = [
    [[c.org, c.mentor ? 'Mentör: ' + c.mentor : '', 'Mentörlük Ders Programı'].filter(Boolean).join(' - ')],
    ['Öğrenci', s.name, 'Sınıf', s.cls, 'Tarih', mentorTarih(p.date)],
    [],
    ['Saat'].concat(MENTOR_GUNLER)
  ];
  for (var t = p.start; t <= p.end; t++) {
    satirlar.push([mentorSaat(t) + '-' + mentorSaat(t + 1)].concat(MENTOR_GUNLER.map(function (_, d) {
      if (mentorOkulMu(db, d, t)) return 'OKUL';
      var v = p.grid[d + '-' + t];
      var ders = v && mentorDers(db, v.c);
      return ders ? ders.name + (v.m ? ' (' + mentorEtiket(v) + ')' : '') : '';
    })));
  }
  satirlar.push([], ['Notlar', p.note || '']);
  return satirlar;
}

function mentorCsv(satirlar) {
  var q = function (x) { return '"' + String(x === undefined || x === null ? '' : x).replace(/"/g, '""') + '"'; };
  return '﻿' + satirlar.map(function (r) { return r.map(q).join(';'); }).join('\r\n');
}
</script>
