<title>MD Education Asist</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Yerleşim: solda mavi menü, sağda araç paneli. Giriş ekranı iki parçalı. Yalnızca açık tema. */
  :root {
    color-scheme: light;
    --bg: #F2F6FC;
    --surface: #FFFFFF;
    --surface-2: #EAF1FB;
    --ink: #10264A;
    --muted: #566B8C;
    --line: #D4E0F2;
    --accent: #1D5FD8;
    --accent-ink: #FFFFFF;
    --accent-soft: #DCE9FC;
    --yan: #123F9E;
    --yan-ink: #FFFFFF;
    --yan-muted: #B7C9EE;
    --warn: #A64B0B;
    --warn-soft: #FDEEDC;
    --font-display: 'Schibsted Grotesk', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
  }
  [hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
  h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
  button, input, textarea, select { font: inherit; color: inherit; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { max-width: 78rem; margin-inline: auto; display: grid; gap: 1.25rem; }

  /* Üst başlık */
  .top { display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: flex-end; justify-content: space-between; }
  h1 { font-weight: 700; font-size: clamp(1.5rem, 1.2rem + 1.2vw, 2rem); line-height: 1.15; letter-spacing: -0.01em; }
  .alt { margin: 0.4rem 0 0; color: var(--muted); max-width: 40rem; }
  .top-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .badge {
    font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--accent); background: var(--accent-soft); padding: 0.25rem 0.55rem; border-radius: 4px;
  }
  .btn {
    font-weight: 600; font-size: 0.9rem; padding: 0.5rem 0.85rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); }
  .btn[disabled] { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  /* Ana yerleşim */
  .layout { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 62rem) { .layout { grid-template-columns: minmax(0, 27rem) minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem; display: grid; gap: 1.25rem; min-width: 0; }
  .blok { display: grid; gap: 0.6rem; min-width: 0; }
  .blok-baslik { display: flex; align-items: baseline; justify-content: space-between; gap: 0.75rem; }
  h2 { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .say { font-family: var(--font-mono); font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Girdiler */
  .inp {
    width: 100%; min-width: 0; padding: 0.45rem 0.6rem; border: 1px solid var(--line); border-radius: 5px;
    background: var(--surface-2);
  }
  .inp::placeholder { color: var(--muted); opacity: 0.8; }
  .inp-sayi { width: 3.6rem; text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .mini { font-size: 0.8rem; color: var(--muted); }
  .ikon-btn {
    width: 2rem; height: 2rem; border-radius: 5px; border: 1px solid transparent; background: transparent;
    color: var(--muted); font-size: 1.25rem; line-height: 1; cursor: pointer;
  }
  .ikon-btn:hover { color: var(--warn); border-color: var(--line); }

  .chip {
    min-width: 2.4rem; padding: 0.3rem 0.5rem; border-radius: 5px; border: 1px solid var(--line);
    background: var(--surface-2); font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip-mini { min-width: 2rem; padding: 0.15rem 0.3rem; font-size: 0.75rem; }
  .gunler { display: flex; flex-wrap: wrap; gap: 0.4rem; }

  .yer-satir { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 0.5rem; align-items: center; }

  .og-liste { display: grid; gap: 0.5rem; }
  .og-satir {
    display: grid; gap: 0.45rem 0.5rem; padding: 0.6rem; border: 1px solid var(--line); border-radius: 6px;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "ad sil" "gun max";
    align-items: center;
  }
  .og-ad { grid-area: ad; }
  .og-sil { grid-area: sil; }
  .og-gun { grid-area: gun; display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .og-max { grid-area: max; display: flex; align-items: center; gap: 0.4rem; justify-self: end; }
  details.toplu { border: 1px dashed var(--line); border-radius: 6px; padding: 0.5rem 0.7rem; }
  details.toplu summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
  details.toplu[open] { display: grid; gap: 0.5rem; }
  textarea.inp { min-height: 6rem; resize: vertical; }

  /* Sonuç */
  .ozet { display: flex; flex-wrap: wrap; gap: 0.5rem 0; border: 1px solid var(--line); border-radius: 6px; }
  .ozet > div { flex: 1 1 8rem; padding: 0.6rem 0.9rem; display: grid; gap: 0.1rem; border-right: 1px solid var(--line); }
  .ozet > div:last-child { border-right: 0; }
  .ozet dt { font-size: 0.75rem; color: var(--muted); }
  .ozet dd { margin: 0; font-family: var(--font-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .ozet .uyari-deger { color: var(--warn); }

  .uyari { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); border-radius: 4px; padding: 0.7rem 0.9rem; display: grid; gap: 0.3rem; }
  .uyari strong { color: var(--warn); font-size: 0.9rem; }
  .uyari ul { margin: 0; padding-left: 1.1rem; font-size: 0.9rem; }
  .uyari p { margin: 0; font-size: 0.85rem; color: var(--muted); }

  .tablo-kap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; min-width: 36rem; }
  th, td { padding: 0.55rem 0.65rem; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: top; text-align: left; }
  th:last-child, td:last-child { border-right: 0; }
  tbody tr:last-child th, tbody tr:last-child td { border-bottom: 0; }
  thead th { background: var(--surface-2); font-family: var(--font-display); font-size: 0.85rem; }
  tbody th { font-family: var(--font-display); font-size: 0.9rem; white-space: nowrap; background: var(--surface-2); }
  tbody th small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; color: var(--muted); }
  .kisa { display: none; }
  @media (max-width: 40rem) { .uzun { display: none; } .kisa { display: inline; } }
  .adlar { display: flex; flex-wrap: wrap; gap: 0.25rem; }
  .ad {
    font-size: 0.85rem; padding: 0.1rem 0.45rem; border-radius: 4px; background: var(--accent-soft);
    color: var(--ink); white-space: nowrap;
  }
  .ad.acik { background: transparent; border: 1px dashed var(--warn); color: var(--warn); font-weight: 600; }

  .yuk { display: grid; gap: 0.35rem; }
  .yuk-satir { display: grid; grid-template-columns: minmax(6rem, 11rem) minmax(0, 1fr) 1.6rem; gap: 0.6rem; align-items: center; font-size: 0.9rem; }
  .yuk-ad { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .yuk-ad small { color: var(--muted); }
  .iz { height: 0.6rem; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .dolgu { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.25s ease; }
  .yuk-n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

  .bos { margin: 0; padding: 1.5rem 1rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
  .alt-aksiyon { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
  .durum { font-size: 0.85rem; color: var(--accent); }
  #kopya-alan { font-family: var(--font-mono); font-size: 0.8rem; min-height: 9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  [hidden] { display: none !important; }

  .arac { display: grid; gap: 1.25rem; }
  .panel-ad {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.2rem, 1.05rem + 0.8vw, 1.6rem); line-height: 1.2;
  }

  /* Sınav analizi */
  @media (min-width: 62rem) { .layout-sinav { grid-template-columns: minmax(0, 34rem) minmax(0, 1fr); } }
  .gecme-satir { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
  .soru-bas, .soru-satir { display: grid; grid-template-columns: 2.4rem 4.2rem minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; }
  .soru-bas { font-size: 0.75rem; color: var(--muted); }
  .soru-no { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); }
  .puan-tablo { min-width: 0; width: max-content; }
  .puan-tablo th, .puan-tablo td { padding: 0.3rem 0.35rem; }
  .puan-tablo thead th { font-size: 0.75rem; text-align: center; }
  .puan-tablo thead th:first-child, .puan-tablo tbody th { position: sticky; left: 0; z-index: 1; text-align: left; }
  .puan-tablo thead th:first-child { background: var(--surface-2); }
  .puan-tablo tbody th { background: var(--surface); min-width: 9.5rem; font-weight: 400; }
  .puan-tablo .inp-sayi { width: 3.4rem; padding-inline: 0.25rem; }
  .puan-tablo .sayi { text-align: center; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .puan-tablo .toplam { font-weight: 500; }
  .etiket {
    display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 0.05rem 0.4rem; border-radius: 4px;
    background: var(--accent-soft); white-space: nowrap;
  }
  .etiket-uyari { background: var(--warn-soft); color: var(--warn); }
  .kay { max-height: 24rem; overflow: auto; }
  .sayisal { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .iz.esikli { position: relative; overflow: visible; }
  .esik { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: 0.55; }
  .dolgu.uyari-dolgu { background: var(--warn); }

  /* Sol menülü kabuk */
  .kabuk { display: grid; grid-template-columns: 15.5rem minmax(0, 1fr); min-height: 100%; min-height: 100vh; }
  .yan {
    background: var(--yan); color: var(--yan-ink); padding-block: 1.25rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 1rem;
  }
  .yan :focus-visible, .giris-tanitim :focus-visible { outline-color: #fff; }
  .yan-ic { position: sticky; top: 1.25rem; display: grid; gap: 1.5rem; }
  .yan-marka { display: flex; align-items: center; gap: 0.7rem; }
  .yan-logo {
    display: grid; place-items: center; flex: none; width: 2.4rem; height: 2.4rem; border-radius: 8px;
    background: #fff; color: var(--yan); font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
  }
  .yan-ad { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.15; }
  .yan-alt { margin: 0; font-size: 0.8rem; color: var(--yan-muted); }
  .hesap {
    display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 0.7rem; align-items: center;
    padding: 0.75rem; border-radius: 8px; background: rgba(255, 255, 255, 0.1);
  }
  .av {
    grid-row: span 2; display: grid; place-items: center; width: 2.3rem; height: 2.3rem; border-radius: 50%;
    background: rgba(255, 255, 255, 0.22); font-weight: 600; font-size: 0.85rem;
  }
  .hesap-ad, .hesap .yan-alt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hesap-ad { margin: 0; font-weight: 600; }
  .cikis {
    grid-column: 1 / -1; margin-top: 0.6rem; padding: 0.4rem 0.7rem; border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.4); background: transparent; color: var(--yan-ink);
    font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .cikis:hover { background: rgba(255, 255, 255, 0.14); }
  .rol-satir { grid-column: 1 / -1; margin: 0.55rem 0 0; display: flex; flex-wrap: wrap; gap: 0.3rem 0.5rem; align-items: center; font-size: 0.78rem; }
  .rol-rozet { padding: 0.1rem 0.5rem; border-radius: 999px; background: #fff; color: var(--yan); font-weight: 700; font-size: 0.72rem; }
  .rol-rozet:empty { display: none; }
  .rol-okul { color: var(--yan-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .rol-not { grid-column: 1 / -1; margin: 0.45rem 0 0; font-size: 0.78rem; color: var(--yan-ink); background: rgba(255, 255, 255, 0.12); border-radius: 6px; padding: 0.4rem 0.55rem; }
  .okula-katil { grid-column: 1 / -1; margin-top: 0.5rem; font-size: 0.85rem; }
  .okula-katil summary { cursor: pointer; font-weight: 600; }
  .okula-katil-form { display: grid; gap: 0.4rem; margin-top: 0.4rem; }
  .okula-katil-form .inp { background: #fff; color: var(--ink); }
  .yan-baslik-ara { margin-top: 0.9rem; }
  .nav-ust { margin-bottom: 0.7rem; background: rgba(255, 255, 255, 0.1); }
  .badge:empty { display: none; }
  .okul-kodu-inp { font-family: var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; }
  .yan-nav { display: grid; gap: 0.25rem; }
  .yan-baslik { margin: 0 0 0.25rem; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yan-muted); }
  .nav-btn {
    display: flex; align-items: center; gap: 0.7rem; width: 100%; padding: 0.6rem 0.75rem; border: 0; border-radius: 8px;
    background: transparent; color: var(--yan-ink); font-weight: 600; text-align: left; cursor: pointer;
  }
  .nav-btn svg { flex: none; }
  .nav-btn:hover { background: rgba(255, 255, 255, 0.12); }
  .nav-btn[aria-current="page"] { background: #fff; color: var(--yan); }
  .icerik {
    min-width: 0; padding-block: 1.5rem 2.5rem; padding-left: 1.5rem;
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .arac { display: grid; gap: 1.25rem; max-width: 78rem; margin-inline: auto; }
  .panel-ad {
    margin: 0; font-family: var(--font-display); font-weight: 700;
    font-size: clamp(1.2rem, 1.05rem + 0.8vw, 1.6rem); line-height: 1.2;
  }
  .yukleniyor { min-height: 100%; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 56rem) {
    .kabuk { grid-template-columns: minmax(0, 1fr); }
    .yan { padding-block: 0.9rem; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .yan-ic { position: static; gap: 0.8rem; }
    .yan-baslik { display: none; }
    .yan-nav { display: flex; overflow-x: auto; gap: 0.35rem; }
    .nav-btn { width: auto; white-space: nowrap; }
    .icerik { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-top: 1.1rem; }
  }

  /* Giriş ekranı */
  .giris-kap { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; min-height: 100vh; }
  @media (min-width: 56rem) { .giris-kap { grid-template-columns: minmax(0, 1fr) minmax(0, 34rem); } }
  .giris-tanitim {
    background: var(--yan); color: var(--yan-ink); display: grid; align-content: center; gap: 1.5rem;
    padding-block: 2rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 2rem;
  }
  @media (min-width: 56rem) { .giris-tanitim { padding-left: 4rem; } }
  .giris-tanitim h1 { font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.5rem); line-height: 1.12; max-width: 22rem; }
  .giris-liste { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; max-width: 26rem; }
  .giris-liste li { display: grid; gap: 0.1rem; padding-left: 0.9rem; border-left: 3px solid rgba(255, 255, 255, 0.55); }
  .giris-liste span { color: var(--yan-muted); }
  .giris-form-kap {
    display: grid; place-items: center; padding-block: 2rem;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .giris-kart { width: 100%; max-width: 24rem; display: grid; gap: 1rem; }
  .giris-kart form { display: grid; gap: 0.9rem; }
  .segment { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
  .seg { padding: 0.5rem; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-weight: 600; cursor: pointer; }
  .seg[aria-selected="true"] { background: #fff; color: var(--accent); box-shadow: 0 1px 2px rgba(16, 38, 74, 0.14); }
  .alan { display: grid; gap: 0.3rem; }
  .alan label { font-size: 0.85rem; font-weight: 600; }
  .alan .inp { background: var(--surface); padding: 0.6rem 0.7rem; }
  .btn-genis { width: 100%; padding-block: 0.7rem; }
  .hata-kutu { margin: 0; padding: 0.6rem 0.8rem; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-size: 0.9rem; }
  .ipucu { margin: 0; font-size: 0.8rem; color: var(--muted); }
  .giris-baslik { margin: 0 0 0.3rem; font-size: 1.3rem; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .giris-form { display: grid; gap: 0.9rem; }
  .giris-baglar { display: flex; flex-wrap: wrap; gap: 0.4rem 1.1rem; }
  .giris-link { justify-self: center; font-size: 0.9rem; }
  .link-btn { border: 0; background: none; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .link-btn[disabled] { color: var(--muted); cursor: default; text-decoration: none; }
  .kod-inp { font-family: var(--font-mono); font-size: 1.4rem !important; letter-spacing: 0.4em; text-align: center; }
  .bilgi-kutu { margin: 0; padding: 0.6rem 0.8rem; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-size: 0.9rem; }
  .uyari-kutu { margin: 0; padding: 0.65rem 0.85rem; border-radius: 6px; background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); font-size: 0.9rem; }
  .uyari-kutu strong { color: var(--warn); }
  .surum { margin: 0; font-size: 0.75rem; color: var(--muted); text-align: center; }
  .segment-3 { grid-template-columns: repeat(3, 1fr); }
  .segment-3 .seg { padding-inline: 0.3rem; font-size: 0.88rem; line-height: 1.2; }
  .seg[aria-checked="true"] { background: #fff; color: var(--accent); box-shadow: 0 1px 2px rgba(16, 38, 74, 0.14); }
  .alan-etiket { font-size: 0.85rem; font-weight: 600; }
  .alan-not { font-weight: 400; color: var(--muted); }
  .demo-not { margin: 0; padding: 0.6rem 0.8rem; border: 1px dashed var(--line); border-radius: 6px; font-size: 0.8rem; color: var(--muted); }

  /* Sınav analizi */
  @media (min-width: 62rem) { .layout-sinav { grid-template-columns: minmax(0, 32rem) minmax(0, 1fr); } }
  .gecme-satir { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
  .yukle {
    position: relative; display: grid; gap: 0.25rem; justify-items: center; text-align: center; padding: 1.4rem 1rem;
    border: 2px dashed var(--accent); border-radius: 8px; background: var(--accent-soft); cursor: pointer;
  }
  .yukle.surukle { background: #fff; }
  .yukle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .yukle-baslik { font-weight: 600; color: var(--accent); }
  .gizli-girdi { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
  .eslesme-ayar { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0.5rem 0.75rem; align-items: center; }
  .eslesme-ayar .inp-sayi { width: 4.5rem; text-align: left; }

<script>
  (function () {
    var ARACLAR = ['nobet', 'sinav', 'mentor', 'yillik', 'degerlendirme'];
    var PANELLER = ['veri', 'okul', 'admin'];
    var TUMU = ARACLAR.concat(PANELLER);
    var gorunur = ARACLAR.slice();

    function sec(id) {
      if (gorunur.indexOf(id) < 0) id = gorunur[0] || 'bos';
      TUMU.concat(['bos']).forEach(function (k) {
        var acik = k === id;
        var n = $('nav-' + k);
        if (n) { if (acik) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current'); }
        $('panel-' + k).hidden = !acik;
      });
      document.dispatchEvent(new CustomEvent('mdea:panel', { detail: { id: id } }));
    }
    MDEA.panelSec = sec;
    TUMU.forEach(function (k) {
      $('nav-' + k).addEventListener('click', function () { sec(k); });
    });
    function hasheGit() {
      var h = (location.hash || '').replace('#', '');
      if (gorunur.indexOf(h) > -1) sec(h);
    }
    window.addEventListener('hashchange', hasheGit);

    /* Rol bilgisine göre menü: yalnızca izin verilen araçlar ve paneller görünür */
    function rolUygula(b) {
      b = b || MDEA.bilgi || {};
      var araclar = (b.araclar || []).filter(function (x) { return ARACLAR.indexOf(x) > -1; });
      var paneller = (b.paneller || []).filter(function (x) { return PANELLER.indexOf(x) > -1; });
      gorunur = araclar.concat(paneller);
      ARACLAR.forEach(function (k) { $('nav-' + k).hidden = araclar.indexOf(k) < 0; });
      PANELLER.forEach(function (k) { $('nav-' + k).hidden = paneller.indexOf(k) < 0; });
      $('yonetim-baslik').hidden = !paneller.some(function (p) { return p !== 'veri'; });
      $('araclar-baslik').hidden = !araclar.length;
      $('kullanici-rol').textContent = b.rolAdi || '';
      $('kullanici-okul').textContent = b.okul ? b.okul.ad : '';
      var bas = $('kullanici-basvuru');
      bas.hidden = !b.basvuru;
      bas.textContent = b.basvuru ? 'Yöneticilik başvurunuz (' + b.basvuru.okulAdi + ') onay bekliyor.' : '';
      var katil = (b.rol === 'ogretmen' || b.rol === 'ogrenci') && !b.okul && !b.basvuru;
      $('okula-katil').hidden = !katil;
      if (!katil) $('okula-katil').open = false;
      $('bos-metin').textContent = b.rol === 'ogrenci'
        ? (b.okul ? 'Okulunuz henüz öğrencilere araç açmadı. Açıldığında burada görünecek.' : 'Araçları görmek için soldaki "Okul kodu gir" bölümünden okulunuza katılın.')
        : 'Okulunuz size henüz araç açmadı. Okul yöneticinizle görüşün.';
      var h = (location.hash || '').replace('#', '');
      var acik = TUMU.filter(function (k) { return !$('panel-' + k).hidden; })[0];
      sec(gorunur.indexOf(h) > -1 ? h : (gorunur.indexOf(acik) > -1 ? acik : gorunur[0]));
    }
    MDEA.rolUygula = rolUygula;
    document.addEventListener('mdea:giris', function (e) { rolUygula(e.detail); });

    $('okula-katil-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var kod = $('okula-katil-kod').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      var h = $('okula-katil-hata');
      if (kod.length !== 6) { h.textContent = 'Kod 6 karakter olmalı.'; h.hidden = false; return; }
      h.hidden = true;
      MDEA.cagir('okulaKatil', [MDEA.token, kod]).then(function (r) {
        if (!r || !r.ok) { h.textContent = (r && r.hata) || 'Katılınamadı.'; h.hidden = false; return; }
        Object.keys(r.bilgi).forEach(function (a) { MDEA.bilgi[a] = r.bilgi[a]; });
        $('okula-katil-kod').value = '';
        rolUygula(MDEA.bilgi);
      }).catch(function (err) {
        if (err && /Oturum/.test(err.message)) { MDEA.oturumBitti(); return; }
        h.textContent = (err && err.message) || 'Bağlantı hatası.'; h.hidden = false;
      });
    });
    MDEA.baslat();
  })();
</script>
