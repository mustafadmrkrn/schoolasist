<script>
/**
 * Yıllık plan: saf yardımcılar (DOM yok, testli).
 *
 * Akış: dosya (Excel/CSV ya da Word tablosu) → satır dizisi → plan satırları
 * ({ hafta, bas, bit, ay, haftaMetni, unite, konu, kazanimlar[], saat, aciklama, tatil })
 * → takvimdeki ders haftasıyla eşleştirme.
 *
 * Hafta eşleştirme sırası:
 *  1) Satırda tarih aralığı varsa ("08-12 Eylül", "29 Eylül - 03 Ekim", "08.09.2026-12.09.2026")
 *     ve bu tarihler seçili öğretim yılına düşüyorsa doğrudan tarih kullanılır.
 *  2) Yoksa hafta numarası ("1. Hafta") ya da satır sırası, takvimdeki ders haftalarına
 *     (tatiller atlanarak) eşlenir.
 */
var YP_AYLAR = ['ocak', 'şubat', 'mart', 'nisan', 'mayıs', 'haziran', 'temmuz', 'ağustos', 'eylül', 'ekim', 'kasım', 'aralık'];
var YP_AY_KOK = ['oca', 'şub', 'mar', 'nis', 'may', 'haz', 'tem', 'ağu', 'eyl', 'eki', 'kas', 'ara'];

/** 2026-2027 MEB çalışma takvimi (varsayılan; ekrandan değiştirilebilir). */
function ypVarsayilanTakvim() {
  return {
    yil: '2026-2027',
    baslangic: '2026-09-14',
    bitis: '2027-06-25',
    tatiller: [
      { ad: '1. dönem ara tatili', bas: '2026-11-16', bit: '2026-11-20' },
      { ad: 'Yarıyıl tatili', bas: '2027-01-25', bit: '2027-02-05' },
      { ad: '2. dönem ara tatili', bas: '2027-03-08', bit: '2027-03-12' }
    ]
  };
}

/* ---------- Tarih yardımcıları (yerel saat, öğlen 12'de; yaz saati kaymasına karşı) ---------- */
function ypTarih(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null;
}
function ypIso(d) {
  var p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function ypGunEkle(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
function ypPazartesi(d) { var g = (d.getDay() + 6) % 7; return ypGunEkle(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12), -g); }
function ypKisaTarih(iso) {
  var d = ypTarih(iso);
  return d ? d.getDate() + ' ' + YP_AYLAR[d.getMonth()].charAt(0).toLocaleUpperCase('tr') + YP_AYLAR[d.getMonth()].slice(1) : '';
}
function ypAralikMetni(bas, bit) {
  var a = ypTarih(bas), b = ypTarih(bit);
  if (!a || !b) return '';
  var ay = function (d) { var x = YP_AYLAR[d.getMonth()]; return x.charAt(0).toLocaleUpperCase('tr') + x.slice(1); };
  if (a.getMonth() === b.getMonth()) return a.getDate() + '–' + b.getDate() + ' ' + ay(a) + ' ' + b.getFullYear();
  return a.getDate() + ' ' + ay(a) + ' – ' + b.getDate() + ' ' + ay(b) + ' ' + b.getFullYear();
}

/**
 * Öğretim yılının haftaları (Pazartesi başlangıçlı). Tatil haftaları { tatil: 'ad' } ile işaretlenir,
 * ders haftalarına 1'den başlayarak sıra numarası verilir.
 */
function ypHaftalar(takvim) {
  var bas = ypTarih(takvim.baslangic), son = ypTarih(takvim.bitis);
  if (!bas || !son || son < bas) return [];
  var tatiller = (takvim.tatiller || []).map(function (t) { return { ad: t.ad, bas: ypTarih(t.bas), bit: ypTarih(t.bit) }; })
    .filter(function (t) { return t.bas && t.bit; });
  var sonuc = [];
  var no = 0;
  for (var p = ypPazartesi(bas); p <= son; p = ypGunEkle(p, 7)) {
    var cuma = ypGunEkle(p, 4);
    // Hafta içi günlerin hepsi tatildeyse tatil haftasıdır.
    var tatil = null;
    tatiller.forEach(function (t) { if (!tatil && t.bas <= ypGunEkle(p, 0) && t.bit >= cuma) tatil = t.ad; });
    var h = { bas: ypIso(p), bit: ypIso(cuma) };
    if (tatil) h.tatil = tatil; else h.no = ++no;
    sonuc.push(h);
  }
  return sonuc;
}

/** Verilen tarihin (ISO) düştüğü hafta; hafta sonu bir sonraki haftaya sayılır. */
function ypHaftaBul(haftalar, iso) {
  var d = ypTarih(iso);
  if (!d) return -1;
  var g = (d.getDay() + 6) % 7;
  if (g >= 5) d = ypGunEkle(d, 7 - g);
  var p = ypIso(ypPazartesi(d));
  for (var i = 0; i < haftalar.length; i++) if (haftalar[i].bas === p) return i;
  if (haftalar.length && p < haftalar[0].bas) return 0;
  return haftalar.length - 1;
}

/* ---------- Metin okuma ---------- */
function ypBuyuk(v) { return String(v === null || v === undefined ? '' : v).toLocaleUpperCase('tr-TR'); }
function ypTemiz(v) { return String(v === null || v === undefined ? '' : v).replace(/ /g, ' ').replace(/[ \t]+/g, ' ').replace(/\s*\n\s*/g, '\n').trim(); }

function ypAyNo(metin) {
  var t = String(metin).toLocaleLowerCase('tr-TR');
  for (var i = 0; i < 12; i++) if (t.indexOf(YP_AY_KOK[i]) === 0) return i;
  return -1;
}

/**
 * Metindeki tarih aralığını okur. yilBas: öğretim yılının başladığı yıl (Eylül-Aralık bu yıl,
 * Ocak-Ağustos sonraki yıl sayılır). Dönüş { bas, bit } (ISO) ya da null.
 */
function ypTarihAraligi(metin, yilBas) {
  var t = String(metin || '').toLocaleLowerCase('tr-TR').replace(/\s+/g, ' ');
  var yil = function (ay, y) { return y ? (y < 100 ? 2000 + y : y) : (ay >= 8 ? yilBas : yilBas + 1); };
  var yap = function (g1, a1, y1, g2, a2, y2) {
    var d1 = new Date(yil(a1, y1), a1, g1, 12), d2 = new Date(yil(a2, y2), a2, g2, 12);
    if (isNaN(d1) || isNaN(d2) || d1.getDate() !== g1 || d2.getDate() !== g2 || d2 < d1 || (d2 - d1) > 13 * 864e5) return null;
    return { bas: ypIso(d1), bit: ypIso(d2) };
  };
  var m;
  // 08.09.2026 - 12.09.2026  |  08/09/2026-12/09/2026  |  8.9-12.9.2026
  m = /(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?\s*[-–—]\s*(\d{1,2})[./](\d{1,2})[./]?(\d{2,4})?/.exec(t);
  if (m) {
    var y2 = m[6] ? +m[6] : (m[3] ? +m[3] : 0);
    var r = yap(+m[1], +m[2] - 1, m[3] ? +m[3] : y2, +m[4], +m[5] - 1, y2);
    if (r) return r;
  }
  // 8 - 12.09.2026 (aynı ay)
  m = /(\d{1,2})\s*[-–—]\s*(\d{1,2})[./](\d{1,2})[./](\d{2,4})/.exec(t);
  if (m) { var r1 = yap(+m[1], +m[3] - 1, +m[4], +m[2], +m[3] - 1, +m[4]); if (r1) return r1; }
  // 29 eylül - 03 ekim (2026)
  m = /(\d{1,2})\s*([a-zçğıöşü]{3,})\.?\s*(\d{4})?\s*[-–—]\s*(\d{1,2})\s*([a-zçğıöşü]{3,})\.?\s*(\d{4})?/.exec(t);
  if (m && ypAyNo(m[2]) > -1 && ypAyNo(m[5]) > -1) {
    var r2 = yap(+m[1], ypAyNo(m[2]), m[3] ? +m[3] : 0, +m[4], ypAyNo(m[5]), m[6] ? +m[6] : 0);
    if (r2) return r2;
  }
  // 08-12 eylül (2026)
  m = /(\d{1,2})\s*[-–—]\s*(\d{1,2})\s*([a-zçğıöşü]{3,})\.?\s*(\d{4})?/.exec(t);
  if (m && ypAyNo(m[3]) > -1) {
    var r3 = yap(+m[1], ypAyNo(m[3]), m[4] ? +m[4] : 0, +m[2], ypAyNo(m[3]), m[4] ? +m[4] : 0);
    if (r3) return r3;
  }
  return null;
}

function ypHaftaNo(metin) {
  var t = ypBuyuk(metin);
  var m = /(\d{1,2})\s*\.?\s*HAFTA/.exec(t) || /HAFTA\s*[:.]?\s*(\d{1,2})\b/.exec(t);
  if (m) return +m[1];
  m = /^\s*(\d{1,2})\s*\.?\s*$/.exec(t);
  return m ? +m[1] : null;
}

/* ---------- Word (.docx) tabloları ---------- */
function ypXmlMetin(x) {
  return x.replace(/<w:tab\/>/g, ' ').replace(/<w:br[^>]*\/>/g, '\n').replace(/<\/w:p>/g, '\n')
    .replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, '&');
}

/** word/document.xml içindeki tabloları satır dizilerine çevirir (yatay birleşik hücreler boş hücreyle doldurulur). */
function ypDocxTablolari(xml) {
  var tablolar = [];
  var tblRe = /<w:tbl>([\s\S]*?)<\/w:tbl>/g, m;
  xml = String(xml);
  while ((m = tblRe.exec(xml))) {
    var satirlar = [];
    var trRe = /<w:tr[ >][\s\S]*?<\/w:tr>/g, tr;
    while ((tr = trRe.exec(m[1]))) {
      var hucreler = [];
      var tcRe = /<w:tc(?:\s[^>]*)?>([\s\S]*?)<\/w:tc>/g, tc;
      while ((tc = tcRe.exec(tr[0]))) {
        var span = /<w:gridSpan w:val="(\d+)"/.exec(tc[1]);
        hucreler.push(ypTemiz(ypXmlMetin(tc[1])));
        for (var s = 1; span && s < +span[1]; s++) hucreler.push('');
      }
      if (hucreler.length) satirlar.push(hucreler);
    }
    if (satirlar.length) tablolar.push(satirlar);
  }
  return tablolar;
}

/** Word belgesinin tablo dışındaki ilk paragrafları (başlıktan ders/sınıf tahmini için). */
function ypDocxBaslik(xml) {
  var dis = String(xml).replace(/<w:tbl>[\s\S]*?<\/w:tbl>/g, '');
  return ypTemiz(ypXmlMetin(dis)).split('\n').filter(Boolean).slice(0, 6).join(' ');
}

/* ---------- Plan çıkarma ---------- */
var YP_SUTUN = {
  ay: /^AY(LAR)?$|^AY\b/,
  hafta: /HAFTA|TARİH/,
  saat: /SAAT|SÜRE/,
  unite: /ÜNİTE|TEMA|ÖĞRENME ALANI|ALAN/,
  konu: /KONU|İÇERİK|ALT ÖĞRENME/,
  kazanim: /KAZANIM|ÖĞRENME ÇIKTI|BECERİ/,
  aciklama: /AÇIKLAMA|YÖNTEM|TEKNİK|ARAÇ|DEĞERLENDİRME|ETKİNLİK|BELİRLİ GÜN/
};

/** Başlık satırını ve sütunları bulur. */
function ypBasliklariBul(rows) {
  var en = { puan: 0 };
  for (var i = 0; i < Math.min(rows.length, 30); i++) {
    var r = rows[i] || [];
    var s = {};
    var puan = 0;
    r.forEach(function (h, c) {
      var b = ypBuyuk(ypTemiz(h));
      if (!b || b.length > 80) return;
      Object.keys(YP_SUTUN).forEach(function (alan) {
        if (s[alan] === undefined && YP_SUTUN[alan].test(b)) {
          // "AY" sütun adı "AYIN BELİRLİ GÜNLERİ" gibi başlıklarla karışmasın
          if (alan === 'ay' && /GÜN|HAFTA/.test(b)) return;
          if (alan === 'unite' && s.kazanim === c) return;
          s[alan] = c;
          puan += alan === 'kazanim' ? 3 : 1;
        }
      });
    });
    if (s.kazanim !== undefined && puan > en.puan) en = { puan: puan, satir: i, sutun: s };
  }
  return en.puan ? en : null;
}

/** Bir tablodaki plan satırlarını çıkarır. yilBas: öğretim yılının başladığı yıl. */
function ypPlanCikar(rows, yilBas) {
  var b = ypBasliklariBul(rows);
  if (!b) return null;
  var s = b.sutun;
  var cell = function (r, alan) { return s[alan] === undefined ? '' : ypTemiz(r[s[alan]]); };
  var sonuc = [];
  var onceki = {};
  for (var i = b.satir + 1; i < rows.length; i++) {
    var r = rows[i] || [];
    if (!r.some(function (v) { return ypTemiz(v); })) continue;
    // Başlık tekrarı (sayfa başlarında) atlanır
    if (ypBuyuk(cell(r, 'kazanim')) && YP_SUTUN.kazanim.test(ypBuyuk(cell(r, 'kazanim'))) && ypBuyuk(cell(r, 'kazanim')).length < 40) continue;
    var tumMetin = r.map(ypTemiz).join(' ');
    var ay = cell(r, 'ay') || onceki.ay || '';
    var haftaMetni = cell(r, 'hafta');
    var kaz = cell(r, 'kazanim');
    var kazanimlar = ypKazanimlariAyir(kaz);
    // Tatil satırı: tatil yazıyor ve kazanım yok ya da tek satırlık bir not var
    var tatil = /TATİL/.test(ypBuyuk(tumMetin)) && kazanimlar.length <= 1 && !/\d+\.\d+\.\d+/.test(kaz);
    var satir = {
      ay: ay,
      haftaMetni: haftaMetni,
      saat: cell(r, 'saat'),
      unite: cell(r, 'unite'),
      konu: cell(r, 'konu'),
      kazanimlar: tatil ? [] : kazanimlar,
      aciklama: cell(r, 'aciklama'),
      tatil: tatil
    };
    var ar = ypTarihAraligi(haftaMetni, yilBas) || ypTarihAraligi(ay + ' ' + haftaMetni, yilBas) || (s.hafta === undefined ? ypTarihAraligi(tumMetin, yilBas) : null);
    if (ar) { satir.bas = ar.bas; satir.bit = ar.bit; }
    var no = ypHaftaNo(haftaMetni);
    if (no) satir.hafta = no;
    // Aynı haftanın devam satırı (birleşik hafta hücresi boş): öncekine ekle
    if (!haftaMetni && !satir.tatil && sonuc.length && s.hafta !== undefined) {
      var son = sonuc[sonuc.length - 1];
      son.kazanimlar = son.kazanimlar.concat(satir.kazanimlar);
      if (satir.konu && son.konu.indexOf(satir.konu) < 0) son.konu = (son.konu ? son.konu + '\n' : '') + satir.konu;
      if (satir.unite && !son.unite) son.unite = satir.unite;
      if (satir.aciklama && son.aciklama.indexOf(satir.aciklama) < 0) son.aciklama = (son.aciklama ? son.aciklama + '\n' : '') + satir.aciklama;
      continue;
    }
    if (!satir.unite && onceki.unite) { satir.unite = onceki.unite; satir.uniteDevam = true; }
    if (!satir.kazanimlar.length && !satir.tatil && !satir.konu) continue;
    onceki = { ay: ay, unite: satir.unite };
    sonuc.push(satir);
  }
  return sonuc.length ? { satirlar: sonuc, sutunlar: Object.keys(s) } : null;
}

/** Kazanım hücresini maddelere ayırır: satır sonları, madde işaretleri ve kazanım kodları (M.9.1.1.1., MAT.9.1.2. vb.). */
function ypKazanimlariAyir(metin) {
  var t = ypTemiz(metin);
  if (!t) return [];
  // Kodlu kazanım başlarında böl (satır içinde birden fazla kod varsa)
  t = t.replace(/\s+(?=([A-ZÇĞİÖŞÜ]{1,6}\.)?\d{1,2}\.\d{1,2}\.\d{1,2}(\.\d{1,2})*\.?\s)/g, '\n');
  var parcalar = t.split(/\n|•|●|▪|◦/).map(function (x) { return x.replace(/^[-–*·]\s*/, '').trim(); }).filter(Boolean);
  // Kodsuz devam satırlarını önceki maddeye bağla (ör. kelime ortasında bölünmüş satır)
  var sonuc = [];
  parcalar.forEach(function (p) {
    var kodlu = /^([A-ZÇĞİÖŞÜa-zçğıöşü]{1,8}\.)?\d{1,2}(\.\d{1,2}){1,5}\.?\s/.test(p);
    var kucukBaslar = /^[a-zçğıöşü]/.test(p) && !/^[a-zçğıöşü]\)\s/.test(p);
    if (sonuc.length && kucukBaslar && !kodlu) sonuc[sonuc.length - 1] += ' ' + p;
    else sonuc.push(p);
  });
  return sonuc;
}

/** Bir dosyanın tüm tablolarından en uygun planı seçer (en çok satır çıkan). */
function ypEnIyiPlan(tablolar, yilBas) {
  var en = null;
  tablolar.forEach(function (rows) {
    var p = ypPlanCikar(rows, yilBas);
    if (p && (!en || p.satirlar.length > en.satirlar.length)) en = p;
  });
  // Bazı Word planları her ayı ayrı tabloya böler: hepsi aynı başlıkla bulunduysa birleştir
  var hepsi = [];
  tablolar.forEach(function (rows) { var p = ypPlanCikar(rows, yilBas); if (p) hepsi.push(p); });
  if (hepsi.length > 1) {
    var toplam = hepsi.reduce(function (t, p) { return t + p.satirlar.length; }, 0);
    if (en && toplam > en.satirlar.length * 1.5) {
      return { satirlar: hepsi.reduce(function (a, p) { return a.concat(p.satirlar); }, []), sutunlar: en.sutunlar };
    }
  }
  return en;
}

/**
 * Plan satırlarını takvim haftalarına yerleştirir. Dönüş: { haftalar: [{ ...hafta, satirlar: [...] }], kaynak }.
 * kaynak: 'tarih' (dosyadaki tarihlerden), 'numara' (hafta numarasından) ya da 'sira' (satır sırasından).
 */
function ypYerlestir(satirlar, takvim) {
  var haftalar = ypHaftalar(takvim).map(function (h) { return { bas: h.bas, bit: h.bit, no: h.no, tatil: h.tatil, satirlar: [] }; });
  if (!haftalar.length) return { haftalar: [], kaynak: '' };
  var ilk = haftalar[0].bas, son = haftalar[haftalar.length - 1].bit;
  var dersSatirlari = satirlar.filter(function (s) { return !s.tatil; });
  var tarihli = dersSatirlari.filter(function (s) { return s.bas && s.bas >= ilk && s.bas <= son; }).length;
  var kaynak;
  if (dersSatirlari.length && tarihli / dersSatirlari.length >= 0.6) {
    kaynak = 'tarih';
    dersSatirlari.forEach(function (s) {
      if (!s.bas) return;
      var i = ypHaftaBul(haftalar, s.bas);
      if (i > -1) haftalar[i].satirlar.push(s);
    });
  } else {
    var numarali = dersSatirlari.filter(function (s) { return s.hafta; }).length;
    kaynak = numarali / Math.max(1, dersSatirlari.length) >= 0.6 ? 'numara' : 'sira';
    var dersHaftalari = haftalar.filter(function (h) { return h.no; });
    var son2 = 0;      // son yerleştirilen ders haftası
    var ofset = 0;     // hafta numarası 2. dönemde 1'den yeniden başlarsa eklenecek değer
    dersSatirlari.forEach(function (s) {
      var n;
      if (kaynak === 'numara' && s.hafta) {
        if (s.hafta + ofset < son2 && s.hafta <= 2) ofset = son2;
        n = s.hafta + ofset;
      } else {
        n = son2 + 1;
      }
      son2 = Math.max(son2, n);
      var h = dersHaftalari[n - 1];
      if (h) h.satirlar.push(s);
    });
  }
  return { haftalar: haftalar, kaynak: kaynak };
}

/** Dosya adı ya da başlık metninden ders adı ve sınıf tahmini. */
function ypDersTahmini(metin) {
  // Dosya adlarında Türkçe karakter olmayabilir ("sinif"): İ/I farkını eşitle
  var t = ypBuyuk(String(metin || '').replace(/[_]+/g, ' ')).replace(/S[İI]N[İI]F/g, 'SINIF');
  var sinif = '';
  var m = /(\d{1,2})\s*\.?\s*SINIF/.exec(t) || /SINIF\s*[:.]?\s*(\d{1,2})/.exec(t);
  if (m) sinif = m[1] + '. sınıf';
  var ders = '';
  var d = /(?:SINIF|\d{4}\s*[-–]\s*\d{4}[^A-ZÇĞİÖŞÜ]*)\s*([A-ZÇĞİÖŞÜ .]{3,40}?)\s+(?:DERSİ|DERS)\b/.exec(t) || /([A-ZÇĞİÖŞÜ][A-ZÇĞİÖŞÜ .]{2,40}?)\s+(?:DERSİ|DERS)\b/.exec(t);
  if (d) ders = d[1].replace(/\b(ÜNİTELENDİRİLMİŞ|YILLIK|PLANI?|EĞİTİM|ÖĞRETİM|YILI|LİSESİ|ORTAOKULU|OKULU)\b/g, '').replace(/\s+/g, ' ').trim();
  if (!ders) {
    var dosya = /([A-ZÇĞİÖŞÜ]{4,}(?:\s+[A-ZÇĞİÖŞÜ]{3,})?)/.exec(t.replace(/\.(XLSX|DOCX|XLS|CSV)$/, ' ').replace(/(^|[^A-ZÇĞİÖŞÜ])(YILLIK|YİLLİK|PLAN[IİÜ]?|PLANI|SINIF|ÜNİTELENDİRİLMİŞ|EĞİTİM|ÖĞRETİM|MEB|YENİ|MÜFREDAT|MAARİF)(?=[^A-ZÇĞİÖŞÜ]|$)|\d+/g, ' '));
    if (dosya) ders = dosya[1];
  }
  var bas = function (x) {
    return x.toLocaleLowerCase('tr-TR').replace(/(^|\s)\S/g, function (c) { return c.toLocaleUpperCase('tr-TR'); })
      .replace(/ (Ve|İle|Ya Da) /g, function (c) { return c.toLocaleLowerCase('tr-TR'); });
  };
  return { ders: ders ? bas(ders) : '', sinif: sinif };
}

/** Haftanın kazanımlarını ders defterine yapıştırılacak düz metne çevirir. */
function ypHaftaMetni(ders, hafta) {
  var s = [];
  if (hafta.tatil) return ders + ': ' + hafta.tatil;
  hafta.satirlar.forEach(function (r) {
    if (r.unite) s.push(r.unite);
    if (r.konu) s.push('Konu: ' + r.konu.replace(/\n/g, '; '));
    r.kazanimlar.forEach(function (k) { s.push(k); });
  });
  return s.join('\n');
}
