<div class="top">
  <div>
    <p class="panel-ad">Sınav Analizi</p>
    <p class="alt">Öğrenci puanlarından sınıf özeti, soru güçlüğü, ayırt edicilik ve kazanım başarısı.</p>
  </div>
  <div class="top-actions">
    <span class="badge" id="sn-ornek-etiket">Örnek veri</span>
    <button type="button" class="btn" id="sn-btn-ornek">Örneği yükle</button>
    <button type="button" class="btn" id="sn-btn-temizle">Temizle</button>
  </div>
</div>

<div class="layout layout-sinav">
  <section class="panel" aria-label="Sınav girdileri">
    <div class="blok">
      <div class="blok-baslik"><h2>Sınav</h2></div>
      <div class="gecme-satir">
        <label class="mini" for="sn-gecme">Geçme notu (100 üzerinden)</label>
        <input type="number" id="sn-gecme" class="inp inp-sayi" min="0" max="100" value="50">
      </div>
    </div>

    <div class="blok">
      <div class="blok-baslik"><h2>Sorular</h2><span class="say" id="sn-soru-sayi"></span></div>
      <div id="sn-sorular" class="og-liste"></div>
      <div><button type="button" class="btn" id="sn-soru-ekle">Soru ekle</button></div>
    </div>

    <div class="blok">
      <div class="blok-baslik"><h2>Öğrenci puanları</h2><span class="say" id="sn-ogr-sayi"></span></div>
      <div class="tablo-kap kay"><table class="puan-tablo" id="sn-puanlar"></table></div>
      <div class="alt-aksiyon"><button type="button" class="btn" id="sn-ogr-ekle">Öğrenci ekle</button></div>
      <details class="toplu">
        <summary>Excel’den yapıştır</summary>
        <label class="mini" for="sn-toplu">Her satırda önce ad soyad, sonra soru puanları (sekme veya noktalı virgülle ayrılmış). Soru sayısı kadar sütun yoksa sorular otomatik eklenir. Mevcut öğrenci listesi bununla değişir.</label>
        <textarea class="inp" id="sn-toplu" placeholder="Ayşe Demir&#9;8&#9;10&#9;7&#10;Mehmet Kaya&#9;5&#9;6&#9;0"></textarea>
        <div><button type="button" class="btn" id="sn-toplu-ekle">Listeyi bununla değiştir</button></div>
      </details>
    </div>
  </section>

  <section class="panel" aria-label="Analiz">
    <div class="blok">
      <div class="blok-baslik"><h2>Sınav özeti</h2><span class="durum" id="sn-durum" role="status"></span></div>
      <div id="sn-sonuc" class="blok" aria-live="polite"></div>
      <div class="alt-aksiyon">
        <button type="button" class="btn btn-primary" id="sn-kopyala">Raporu kopyala</button>
      </div>
      <textarea class="inp" id="sn-kopya-alan" readonly hidden aria-label="Rapor metni"></textarea>
    </div>
  </section>
</div>

<script>
(function () {
  function f(n, d) { return Number(n).toFixed(d).replace('.', ','); }
  function g(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }

  var ADLAR = ['Ahmet', 'Ayşe', 'Mehmet', 'Zeynep', 'Mustafa', 'Elif', 'Emre', 'Defne', 'Can', 'Ece', 'Kerem', 'Nehir'];
  var SOYADLAR = ['Yılmaz', 'Kaya', 'Demir', 'Çelik', 'Şahin', 'Aydın', 'Arslan', 'Doğan', 'Koç', 'Polat', 'Güneş', 'Kılıç'];
  var MAX_SORU = 30;

  /* Örnek: 8 soruluk matematik sınavı, 24 öğrenci (uydurma, sabit tohumla üretilir) */
  function ornek() {
    var kaz = ['Doğal sayılarla işlemler', 'Doğal sayılarla işlemler', 'Kesirleri karşılaştırma', 'Kesirleri karşılaştırma',
      'Ondalık gösterim', 'Ondalık gösterim', 'Problem çözme', 'Problem çözme'];
    var puan = [10, 10, 10, 10, 15, 15, 15, 15];
    var zorluk = [0, 0.03, 0.08, 0.12, 0.15, 0.2, 0.5, 0.3];
    var tohum = 7;
    function rnd() { tohum = (tohum * 48271) % 2147483647; return tohum / 2147483647; }
    var ogr = [];
    for (var i = 0; i < 24; i++) {
      var yetenek = 0.5 + rnd() * 0.5;
      var ps = puan.map(function (p, j) {
        var oran = Math.min(1, Math.max(0, yetenek - zorluk[j] + (rnd() - 0.5) * 0.3));
        return Math.round(p * oran);
      });
      ogr.push({ ad: ADLAR[i % 12] + ' ' + SOYADLAR[(i * 5 + 3 + (i >= 12 ? 1 : 0)) % 12], puanlar: ps });
    }
    return {
      gecme: 50,
      sorular: puan.map(function (p, j) { return { puan: p, kazanim: kaz[j] }; }),
      ogrenciler: ogr
    };
  }

  var state = ornek();
  var son = null;
  var zaman = null;
  var istek = 0;

  function planla() {
    $('sn-ornek-etiket').hidden = true;
    clearTimeout(zaman);
    zaman = setTimeout(hesapla, 150);
  }

  function toplamPuan() {
    return state.sorular.reduce(function (t, s) { return t + (s.puan > 0 ? s.puan : 0); }, 0);
  }

  /* ---------- Girdi ---------- */
  function renderSorular() {
    var kap = $('sn-sorular');
    kap.textContent = '';
    $('sn-soru-sayi').textContent = state.sorular.length + ' soru · ' + g(toplamPuan()) + ' puan';
    kap.appendChild(el('div', { class: 'soru-bas' }, [
      el('span', { text: 'Soru' }), el('span', { text: 'Puan' }), el('span', { text: 'Kazanım' }), el('span')
    ]));
    state.sorular.forEach(function (s, j) {
      var puan = el('input', {
        type: 'number', id: 'sn-sp-' + j, class: 'inp inp-sayi', min: '0', step: 'any', value: String(s.puan),
        'aria-label': 'Soru ' + (j + 1) + ' puanı',
        oninput: function () {
          s.puan = parseFloat(this.value) || 0;
          $('sn-soru-sayi').textContent = state.sorular.length + ' soru · ' + g(toplamPuan()) + ' puan';
          renderPuanlar();
          planla();
        }
      });
      var kaz = el('input', {
        type: 'text', id: 'sn-sk-' + j, class: 'inp', value: s.kazanim || '', placeholder: 'Kazanım (isteğe bağlı)',
        'aria-label': 'Soru ' + (j + 1) + ' kazanımı', oninput: function () { s.kazanim = this.value; planla(); }
      });
      var sil = el('button', {
        type: 'button', class: 'ikon-btn', 'aria-label': 'Soru ' + (j + 1) + ' sil', text: '×',
        disabled: state.sorular.length <= 1,
        onclick: function () {
          state.sorular.splice(j, 1);
          state.ogrenciler.forEach(function (o) { o.puanlar.splice(j, 1); });
          renderSorular(); renderPuanlar(); planla();
        }
      });
      kap.appendChild(el('div', { class: 'soru-satir' }, [el('span', { class: 'soru-no', text: 'S' + (j + 1) }), puan, kaz, sil]));
    });
  }

  function renderPuanlar() {
    var t = $('sn-puanlar');
    t.textContent = '';
    $('sn-ogr-sayi').textContent = state.ogrenciler.length + ' öğrenci';
    var bas = [el('th', { scope: 'col', text: 'Öğrenci' })];
    state.sorular.forEach(function (s, j) { bas.push(el('th', { scope: 'col', text: 'S' + (j + 1) })); });
    bas.push(el('th', { scope: 'col', text: 'Top.' }));
    bas.push(el('th', { scope: 'col', 'aria-label': 'Sil' }));
    t.appendChild(el('thead', {}, [el('tr', {}, bas)]));

    var govde = el('tbody');
    state.ogrenciler.forEach(function (o, i) {
      var toplam = el('td', { class: 'sayi toplam' });
      function guncelle() {
        var s = 0;
        state.sorular.forEach(function (soru, j) {
          var v = Number(o.puanlar[j]) || 0;
          s += Math.min(Math.max(v, 0), soru.puan > 0 ? soru.puan : 0);
        });
        toplam.textContent = g(s);
      }
      var ad = el('input', {
        type: 'text', id: 'sn-ad-' + i, class: 'inp', value: o.ad, placeholder: 'Ad soyad',
        'aria-label': 'Öğrenci adı', oninput: function () { o.ad = this.value; planla(); }
      });
      var satir = el('tr', {}, [el('th', { scope: 'row' }, [ad])]);
      state.sorular.forEach(function (s, j) {
        var v = o.puanlar[j];
        satir.appendChild(el('td', {}, [el('input', {
          type: 'number', id: 'sn-p-' + i + '-' + j, class: 'inp inp-sayi', min: '0', max: String(s.puan), step: 'any',
          value: v === '' || v === null || v === undefined ? '' : String(v),
          'aria-label': (o.ad || 'Öğrenci') + ' soru ' + (j + 1),
          oninput: function () { o.puanlar[j] = this.value === '' ? '' : parseFloat(this.value); guncelle(); planla(); }
        })]));
      });
      satir.appendChild(toplam);
      satir.appendChild(el('td', {}, [el('button', {
        type: 'button', class: 'ikon-btn', 'aria-label': (o.ad || 'Bu öğrenciyi') + ' sil', text: '×',
        onclick: function () { state.ogrenciler.splice(i, 1); renderPuanlar(); planla(); }
      })]));
      guncelle();
      govde.appendChild(satir);
    });
    t.appendChild(govde);
  }

  function renderGirdi() {
    $('sn-gecme').value = String(state.gecme);
    renderSorular();
    renderPuanlar();
  }

  /* ---------- Hesaplama ---------- */
  function girdiOlustur() {
    return {
      gecmeNotu: state.gecme,
      sorular: state.sorular.map(function (s, j) {
        return { no: j + 1, puan: s.puan > 0 ? s.puan : 0, kazanim: (s.kazanim || '').trim() };
      }),
      ogrenciler: state.ogrenciler
        .filter(function (o) { return o.ad.trim(); })
        .map(function (o) { return { ad: o.ad.trim(), puanlar: o.puanlar.slice() }; })
    };
  }

  function hesapla() {
    var girdi = girdiOlustur();
    var no = ++istek;
    var p;
    if (typeof sinavAnaliziYap === 'function') {
      p = Promise.resolve(sinavAnaliziYap(girdi));
    } else {
      p = new Promise(function (ok, hata) {
        google.script.run.withSuccessHandler(ok).withFailureHandler(hata).sinavAnaliz(girdi);
      });
    }
    p.then(function (a) { if (no === istek) renderSonuc(a); })
      .catch(function (e) {
        var kap = $('sn-sonuc');
        kap.textContent = '';
        kap.appendChild(el('p', { class: 'bos', text: 'Analiz yapılamadı: ' + (e && e.message ? e.message : e) }));
      });
  }

  /* ---------- Sonuç ---------- */
  function etiket(metin, uyari) {
    return el('span', { class: 'etiket' + (uyari ? ' etiket-uyari' : ''), text: metin });
  }

  function renderSonuc(a) {
    var kap = $('sn-sonuc');
    kap.textContent = '';
    son = null;
    $('sn-kopyala').disabled = true;
    $('sn-kopya-alan').hidden = true;

    if (!a.gecerli) {
      kap.appendChild(el('p', { class: 'bos', text: 'Puanı 0’dan büyük en az bir soru ve en az bir öğrenci ekleyince analiz burada oluşur.' }));
      return;
    }

    function stat(adi, deger) {
      return el('div', {}, [el('dt', { text: adi }), el('dd', { text: deger })]);
    }
    kap.appendChild(el('dl', { class: 'ozet' }, [
      stat('Öğrenci', String(a.n)),
      stat('Ortalama', f(a.ortalama, 1)),
      stat('Medyan', f(a.medyan, 1)),
      stat('En düşük – en yüksek', f(a.enDusuk, 0) + ' – ' + f(a.enYuksek, 0)),
      stat('Geçen', a.gecenSayisi + ' / ' + a.n)
    ]));

    /* Öne çıkanlar */
    var zor = a.sorular.filter(function (s) { return s.guclukEtiket === 'Zor'; });
    var zayif = a.sorular.filter(function (s) { return s.ayirtEtiket === 'Zayıf'; });
    var tekrar = a.kazanimlar.filter(function (k) { return k.tekrar; });
    var notlar = [];
    if (zor.length) {
      notlar.push('Zor sorular: ' + zor.map(function (s) { return 'S' + s.no + ' (' + f(s.guclukDeger, 2) + ')'; }).join(', '));
    }
    if (zayif.length) {
      notlar.push('Ayırt ediciliği zayıf sorular: ' + zayif.map(function (s) { return 'S' + s.no; }).join(', ') + '. Soru metnini ve cevap anahtarını kontrol edin.');
    }
    if (tekrar.length) {
      notlar.push('Tekrar önerilen kazanımlar: ' + tekrar.map(function (k) { return k.ad + ' (%' + f(k.oran * 100, 0) + ')'; }).join(', '));
    }
    if (a.n - a.gecenSayisi > 0) {
      notlar.push('Geçme notunun altında ' + (a.n - a.gecenSayisi) + ' öğrenci var.');
    }
    if (notlar.length) {
      var liste = el('ul');
      notlar.forEach(function (m) { liste.appendChild(el('li', { text: m })); });
      kap.appendChild(el('div', { class: 'uyari', role: 'status' }, [el('strong', { text: 'Öne çıkanlar' }), liste]));
    }

    /* Not dağılımı */
    var enCok = Math.max.apply(null, a.dagilim.map(function (d) { return d.sayi; })) || 1;
    var dag = el('div', { class: 'yuk' });
    a.dagilim.forEach(function (d) {
      var dolgu = el('div', { class: 'dolgu' });
      dolgu.style.width = (d.sayi / enCok * 100) + '%';
      dag.appendChild(el('div', { class: 'yuk-satir' }, [
        el('span', { class: 'yuk-ad sayisal', text: d.ad }), el('div', { class: 'iz' }, [dolgu]), el('span', { class: 'yuk-n', text: String(d.sayi) })
      ]));
    });
    kap.appendChild(el('h2', { text: 'Puan dağılımı (100 üzerinden)' }));
    kap.appendChild(dag);

    /* Soru analizi */
    var govde = el('tbody');
    a.sorular.forEach(function (s) {
      var guclu = s.guclukDeger === null ? '–' : f(s.guclukDeger, 2);
      var ayirt = s.ayirtDeger === null ? '–' : f(s.ayirtDeger, 2);
      govde.appendChild(el('tr', {}, [
        el('th', { scope: 'row', text: 'S' + s.no }),
        el('td', { text: s.kazanim || '–' }),
        el('td', { class: 'sayisal', text: f(s.ortalama, 1) + ' / ' + g(s.puan) }),
        el('td', {}, [el('span', { class: 'sayisal', text: guclu + ' ' }), etiket(s.guclukEtiket, s.guclukEtiket === 'Zor')]),
        el('td', {}, [el('span', { class: 'sayisal', text: ayirt + ' ' }), etiket(s.ayirtEtiket, s.ayirtEtiket === 'Zayıf')])
      ]));
    });
    kap.appendChild(el('h2', { text: 'Soru analizi' }));
    kap.appendChild(el('div', { class: 'tablo-kap' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { scope: 'col', text: 'Soru' }), el('th', { scope: 'col', text: 'Kazanım' }), el('th', { scope: 'col', text: 'Ortalama' }),
        el('th', { scope: 'col', text: 'Güçlük (p)' }), el('th', { scope: 'col', text: 'Ayırt edicilik (D)' })
      ])]),
      govde
    ])]));
    kap.appendChild(el('p', { class: 'mini', text: 'Güçlük: ortalama puanın soru puanına oranı, düşük değer zor soru demektir. Ayırt edicilik: en başarılı ve en az başarılı %27’lik gruplar arasındaki fark.' }));

    /* Kazanım başarısı */
    if (a.kazanimlar.length) {
      var kaz = el('div', { class: 'yuk' });
      a.kazanimlar.forEach(function (k) {
        var dolgu = el('div', { class: 'dolgu' + (k.tekrar ? ' uyari-dolgu' : '') });
        dolgu.style.width = (k.oran * 100) + '%';
        var esik = el('div', { class: 'esik', title: 'Eşik: %60' });
        esik.style.left = '60%';
        kaz.appendChild(el('div', { class: 'yuk-satir' }, [
          el('span', { class: 'yuk-ad', title: k.ad }, [k.ad, el('small', { text: ' (' + k.sorular.map(function (n) { return 'S' + n; }).join(', ') + ')' })]),
          el('div', { class: 'iz esikli' }, [dolgu, esik]),
          el('span', { class: 'yuk-n', text: '%' + f(k.oran * 100, 0) })
        ]));
      });
      kap.appendChild(el('h2', { text: 'Kazanım başarısı' }));
      kap.appendChild(kaz);
      kap.appendChild(el('p', { class: 'mini', text: 'Çizgi %60 eşiğini gösterir. Eşiğin altındaki kazanımlar turuncu görünür ve tekrar için önerilir.' }));
    }

    /* Sıralama */
    var sg = el('tbody');
    a.siralama.forEach(function (s) {
      sg.appendChild(el('tr', {}, [
        el('td', { class: 'sayisal', text: String(s.sira) }),
        el('th', { scope: 'row', text: s.ad }),
        el('td', { class: 'sayisal', text: f(s.yuz, 1) }),
        el('td', {}, [etiket(s.gecti ? 'Geçti' : 'Kaldı', !s.gecti)])
      ]));
    });
    kap.appendChild(el('h2', { text: 'Öğrenci sıralaması' }));
    kap.appendChild(el('div', { class: 'tablo-kap kay' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, [
        el('th', { scope: 'col', text: 'Sıra' }), el('th', { scope: 'col', text: 'Öğrenci' }),
        el('th', { scope: 'col', text: 'Puan' }), el('th', { scope: 'col', text: 'Durum' })
      ])]),
      sg
    ])]));

    son = raporMetni(a);
    $('sn-kopyala').disabled = false;
  }

  function raporMetni(a) {
    var s = [];
    s.push('Sınav analizi');
    s.push('Öğrenci: ' + a.n + ' · Ortalama: ' + f(a.ortalama, 1) + ' · Medyan: ' + f(a.medyan, 1) +
      ' · Geçen: ' + a.gecenSayisi + '/' + a.n + ' (geçme notu ' + g(a.gecmeNotu) + ')');
    s.push('');
    s.push('Sorular (güçlük p / ayırt edicilik D)');
    a.sorular.forEach(function (q) {
      s.push('S' + q.no + (q.kazanim ? ' [' + q.kazanim + ']' : '') + ': ort. ' + f(q.ortalama, 1) + '/' + g(q.puan) +
        ', p=' + (q.guclukDeger === null ? '–' : f(q.guclukDeger, 2)) + ' ' + q.guclukEtiket +
        ', D=' + (q.ayirtDeger === null ? '–' : f(q.ayirtDeger, 2)) + ' ' + q.ayirtEtiket);
    });
    if (a.kazanimlar.length) {
      s.push('');
      s.push('Kazanım başarısı');
      a.kazanimlar.forEach(function (k) {
        s.push(k.ad + ': %' + f(k.oran * 100, 0) + (k.tekrar ? ' (tekrar önerilir)' : ''));
      });
    }
    return s.join('\n');
  }

  function bildir(m) {
    $('sn-durum').textContent = m;
    setTimeout(function () { $('sn-durum').textContent = ''; }, 2500);
  }

  /* ---------- Olaylar ---------- */
  $('sn-gecme').addEventListener('input', function () {
    state.gecme = parseFloat(this.value) || 0;
    planla();
  });

  $('sn-soru-ekle').addEventListener('click', function () {
    if (state.sorular.length >= MAX_SORU) { bildir('En fazla ' + MAX_SORU + ' soru eklenebilir'); return; }
    state.sorular.push({ puan: 10, kazanim: '' });
    state.ogrenciler.forEach(function (o) { o.puanlar.push(''); });
    renderSorular(); renderPuanlar();
    $('sn-sp-' + (state.sorular.length - 1)).focus();
    planla();
  });

  $('sn-ogr-ekle').addEventListener('click', function () {
    state.ogrenciler.push({ ad: '', puanlar: state.sorular.map(function () { return ''; }) });
    renderPuanlar();
    $('sn-ad-' + (state.ogrenciler.length - 1)).focus();
    planla();
  });

  $('sn-toplu-ekle').addEventListener('click', function () {
    var yeni = [];
    var enCok = 0;
    $('sn-toplu').value.split(/\r?\n/).forEach(function (satir) {
      if (!satir.trim()) return;
      var h = satir.split(/\t|;/).map(function (x) { return x.trim(); });
      if (h.length < 2) return;
      var sayilar = h.slice(1).map(function (x) {
        var v = x === '' ? NaN : parseFloat(x.replace(',', '.'));
        return isNaN(v) ? '' : v;
      });
      if (sayilar.every(function (v) { return v === ''; })) return; // başlık satırı
      yeni.push({ ad: h[0], puanlar: sayilar });
      enCok = Math.max(enCok, sayilar.length);
    });
    if (!yeni.length) { bildir('Okunabilir satır bulunamadı'); return; }
    enCok = Math.min(enCok, MAX_SORU);
    while (state.sorular.length < enCok) state.sorular.push({ puan: 10, kazanim: '' });
    yeni.forEach(function (o) {
      o.puanlar = o.puanlar.slice(0, state.sorular.length);
      while (o.puanlar.length < state.sorular.length) o.puanlar.push('');
    });
    state.ogrenciler = yeni;
    $('sn-toplu').value = '';
    renderGirdi();
    planla();
    bildir(yeni.length + ' öğrenci yüklendi');
  });

  $('sn-btn-ornek').addEventListener('click', function () {
    state = ornek();
    renderGirdi();
    hesapla();
    $('sn-ornek-etiket').hidden = false;
  });

  $('sn-btn-temizle').addEventListener('click', function () {
    state = { gecme: 50, sorular: [{ puan: 10, kazanim: '' }], ogrenciler: [] };
    renderGirdi();
    hesapla();
    $('sn-ornek-etiket').hidden = true;
  });

  $('sn-kopyala').addEventListener('click', function () {
    if (!son) return;
    var alan = $('sn-kopya-alan');
    function yedek() {
      alan.value = son;
      alan.hidden = false;
      alan.focus();
      alan.select();
      bildir('Metni seçip kopyalayın');
    }
    try {
      navigator.clipboard.writeText(son).then(function () { bildir('Kopyalandı'); }, yedek);
    } catch (e) { yedek(); }
  });

  renderGirdi();
  hesapla();
